name: Robot Captador Fincaraiz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de captación (arriendo o venta)'
        required: true
        default: 'arriendo'
        type: choice
        options:
          - arriendo
          - venta
  repository_dispatch:
    types: [trigger-scraper]
  schedule:
    # Lunes a Viernes a las 8:00 AM COT (13:00 UTC)
    - cron: '0 13 * * 1-5'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r robot_captador/requirements.txt
          playwright install --with-deps chromium

      - name: Create Google Service Account Key JSON
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python -c "
          import os, base64, json
          key = os.environ.get('GCP_SA_KEY')
          data = None
          if key and len(key.strip()) > 0:
              try:
                  json.loads(key)
                  data = key.encode('utf-8')
              except Exception:
                  try:
                      data = base64.b64decode(key)
                  except Exception:
                      pass
          if not data:
              key_b64 = ''''''
              data = base64.b64decode(key_b64)
          os.makedirs('robot_captador', exist_ok=True)
          with open('real-estate-ocr-468904-38d35bfd32d6.json', 'wb') as f:
              f.write(data)
          with open('robot_captador/real-estate-ocr-468904-38d35bfd32d6.json', 'wb') as f:
              f.write(data)
          print('Service Account JSON created successfully!')
          "

      - name: Run Scraper
        run: |
          MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'arriendo' }}"
          echo "Ejecutando robot captador en modo: $MODE"
          python robot_captador/scraper.py --mode "$MODE" --max-items 30
