name: Robot Captador Fincaraiz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de captación (arriendo o venta)'
        required: true
        default: 'arriendo'
        type: choice
        options:
          - arriendo
          - venta
      bedrooms:
        description: 'Habitaciones: una (3), varias separadas por coma (1,2) o all'
        required: false
        default: 'all'
      sector:
        description: 'Localidad: una (usaquen), varias separadas por coma (usaquen,chapinero) o all'
        required: false
        default: 'all'
      reponer:
        description: 'Reposición: saltar localidad+habitación con 5 o más NUEVO (cuota 20). Para probar el modo de la corrida automática sin esperar al cron.'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [trigger-scraper]
  schedule:
    # Lunes y Jueves a las 8:00 AM COT (13:00 UTC)
    - cron: '0 13 * * 1,4'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r robot_captador/requirements.txt
          playwright install --with-deps chromium

      - name: Create Google Service Account Key JSON
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python robot_captador/create_sa_key.py

      - name: Run Scraper
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Corrida programada (Lunes/Jueves): barrido de reposición, arriendo y venta."
            python robot_captador/scraper.py --mode arriendo --sector all --bedrooms all --max-items 20 --reponer
            python robot_captador/scraper.py --mode venta --sector all --bedrooms all --max-items 20 --reponer
          else
            MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'arriendo' }}"
            BEDROOMS="${{ github.event.inputs.bedrooms || github.event.client_payload.bedrooms || 'all' }}"
            SECTOR="${{ github.event.inputs.sector || github.event.client_payload.sector || 'all' }}"
            REPONER="${{ github.event.inputs.reponer }}"
            if [ "$REPONER" = "true" ]; then
              echo "Ejecutando robot captador (modo reposición manual) | Modo: $MODE | Sector: $SECTOR | Habitaciones: $BEDROOMS"
              python robot_captador/scraper.py --mode "$MODE" --sector "$SECTOR" --bedrooms "$BEDROOMS" --max-items 20 --reponer
            else
              echo "Ejecutando robot captador | Modo: $MODE | Sector: $SECTOR | Habitaciones: $BEDROOMS"
              python robot_captador/scraper.py --mode "$MODE" --sector "$SECTOR" --bedrooms "$BEDROOMS" --max-items 30
            fi
          fi
