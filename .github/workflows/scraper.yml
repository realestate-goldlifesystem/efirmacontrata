name: Robot Captador Fincaraiz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de captación (arriendo o venta)'
        required: true
        default: 'arriendo'
        type: choice
        options:
          - arriendo
          - venta
      bedrooms:
        description: 'Filtro de habitaciones (1, 2, 3, 4, 5, all)'
        required: false
        default: 'all'
      sector:
        description: 'Localidad objetivo'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - usaquen
          - suba
          - chapinero
  repository_dispatch:
    types: [trigger-scraper]
  schedule:
    # Lunes a Viernes a las 8:00 AM COT (13:00 UTC)
    - cron: '0 13 * * 1-5'

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r robot_captador/requirements.txt
          playwright install --with-deps chromium

      - name: Create Google Service Account Key JSON
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python robot_captador/create_sa_key.py

      - name: Run Scraper
        run: |
          MODE="${{ github.event.inputs.mode || github.event.client_payload.mode || 'arriendo' }}"
          BEDROOMS="${{ github.event.inputs.bedrooms || github.event.client_payload.bedrooms || 'all' }}"
          SECTOR="${{ github.event.inputs.sector || github.event.client_payload.sector || 'all' }}"
          echo "Ejecutando robot captador | Modo: $MODE | Sector: $SECTOR | Habitaciones: $BEDROOMS"
          python robot_captador/scraper.py --mode "$MODE" --sector "$SECTOR" --bedrooms "$BEDROOMS" --max-items 30
