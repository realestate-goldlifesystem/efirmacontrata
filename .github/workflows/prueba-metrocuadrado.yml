name: Prueba Miguel-Metrocuadrado

on:
  workflow_dispatch: {}

jobs:
  run-prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r robot_captador/requirements.txt
          playwright install --with-deps chromium

      - name: Create Google Service Account Key JSON
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python robot_captador/create_sa_key.py

      - name: Run Prueba Metrocuadrado
        run: |
          python robot_captador/prueba_metrocuadrado.py
