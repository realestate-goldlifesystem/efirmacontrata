<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Gold Life Real Estate</title>
  <!--
    Página de "no encontrado" de GitHub Pages para todo el sitio.
    Caso especial (oct-2026): el enlace de visita /frontend/v/<ID>/ lo genera cada hora
    .github/workflows/vistas-previas.yml. Si se comparte un inmueble recién publicado
    antes de esa hora, su carpeta aún no existe: aquí se lleva igual a la página de
    agendar (sin la foto en la vista previa, que llega con la siguiente pasada).
  -->
  <script>
    var m = location.pathname.match(/\/frontend\/v\/([A-Za-z0-9-]{4,20})\/?/);
    if (m) location.replace(location.pathname.replace(/\/frontend\/v\/.*$/, '/frontend/visita.html') + '?i=' + encodeURIComponent(m[1]));
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
      background: #0c0a09; color: #f5f5f4; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px; }
    h1 { color: #d4af37; font-size: 20px; letter-spacing: 2px; }
    p { color: #a8a29e; }
  </style>
</head>
<body>
  <div>
    <h1>GOLD LIFE REAL ESTATE</h1>
    <p>No encontramos esta página. Pídele a tu asesor el enlace de nuevo.</p>
  </div>
</body>
</html>
