<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sala de recibo · Gold Life Real Estate</title>
  <!--
    Sala de recibo del inmueble (etapa 3, parte 3 · 29-oct-2026): ?k=<inmueble>&f=<fin>&r=i|p|a&t=<token>.
    Inquilino: propone 3 horarios y carga los recibos de agua, luz y gas. Propietario: elige el horario.
    Leonardo (a): revisa los recibos, marca el inventario y cierra con "Se recibió el inmueble".
    Servidor: backend/RECIBO_INMUEBLE.js. Estilos y piezas de renovacion.html.
  -->
  <style>
    :root { --oro: #d4af37; --fondo: #0c0a09; --panel: #1c1917; --panel2: #292524; --suave: #a8a29e; --linea: #3f3a36; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px 40px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--fondo); color: #f5f5f4;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,175,55,.16), transparent 70%);
    }
    .tarjeta {
      width: 100%; max-width: 560px; margin: 0 auto; background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px; padding: clamp(22px, 5vw, 32px) clamp(16px, 4.5vw, 28px); box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .marca { font-size: 12px; letter-spacing: 3px; font-weight: 700; color: var(--oro); text-align: center; }
    .marca span { color: var(--suave); font-weight: 400; }
    h1 { margin: 22px 0 6px; font-size: clamp(20px, 5vw, 24px); font-weight: 600; text-align: center; }
    h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
    p { margin: 0; line-height: 1.6; color: #d6d3d1; }
    .centro { text-align: center; }
    .inmueble { color: var(--suave); font-size: 14px; text-align: center; margin-bottom: 18px; }
    .nota { font-size: 13px; color: var(--suave); margin-top: 6px; }
    .oculto { display: none !important; }
    button { font-family: inherit; cursor: pointer; transition: opacity .2s, transform .1s, background .15s; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: default; }
    .icono { width: 56px; height: 56px; margin: 20px auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px;
      background: rgba(212,175,55,.1); box-shadow: 0 0 0 1px rgba(212,175,55,.3); }
    .fechas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
    .fechas div { padding: 12px 14px; border-radius: 14px; background: var(--fondo); border: 1px solid rgba(255,255,255,.06); }
    .fechas small { display: block; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--suave); font-weight: 700; }
    .fechas b { display: block; margin-top: 4px; font-size: 15px; } .fechas b::first-letter { text-transform: uppercase; }
    .fechas .limite { border-color: rgba(212,175,55,.45); } .fechas .limite b { color: var(--oro); }
    .aviso { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; }
    .aviso.oro { background: rgba(212,175,55,.1); border: 1px solid rgba(212,175,55,.45); color: #f5f5f4; }
    .aviso.rojo { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.45); color: #fecaca; }
    .decidir { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .decidir button { padding: 18px 10px; border-radius: 16px; font-size: 16px; font-weight: 700; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .decidir button span { font-size: 24px; }
    .renovar { background: linear-gradient(135deg, #e8c766, var(--oro)); color: #0c0a09; }
    .terminar { background: var(--panel2); color: #fca5a5; border: 1px solid rgba(248,113,113,.45) !important; }
    .lista { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    .lista li { padding: 12px 14px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--linea); font-size: 14px; line-height: 1.5; color: #e7e5e4; }
    .lista b { color: var(--oro); }
    .rotulo { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--suave); font-weight: 700; margin: 20px 0 4px; }
    .opciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .opcion { padding: 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel2); color: #f5f5f4; font-size: 14px; }
    .opcion.elegido { background: #f5f5f4; color: #0c0a09; box-shadow: 0 0 0 2px var(--oro); font-weight: 600; }
    textarea { width: 100%; min-height: 76px; padding: 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel2); color: #f5f5f4; font: inherit; font-size: 14.5px; margin-top: 10px; }
    textarea:focus { outline: none; border-color: var(--oro); }
    .principal { width: 100%; padding: 15px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; color: #0c0a09; background: linear-gradient(135deg, #e8c766, var(--oro)); margin-top: 18px; }
    .principal.rojo { background: #b4413a; color: #fff; }
    .principal.bloqueado { opacity: .55; filter: grayscale(.4); }
    .volver { width: 100%; border: 0; background: none; color: var(--suave); font-size: 14px; padding: 12px; margin-top: 4px; }
    .error { color: #fca5a5; font-size: 14px; margin-top: 10px; text-align: center; }
    .confirmar { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.72); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 20px; animation: aparecer .25s ease; }
    .confirmar .caja { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--linea); border-radius: 22px;
      padding: 24px 22px 18px; text-align: center; animation: subirC .3s ease; }
    .confirmar .icono { font-size: 30px; margin: 0 auto 8px; }
    .confirmar h3 { margin: 0 0 8px; font-size: 19px; }
    .confirmar p { color: #d6d3d1; font-size: 14px; line-height: 1.55; margin: 0 0 10px; text-align: left; }
    .confirmar .si { margin-top: 14px; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; background: var(--oro); color: #0c0a09; }
    .confirmar .si.rojo { background: #b4413a; color: #fff; }
    .confirmar .no { width: 100%; border: 0; background: none; color: var(--suave); font-size: 14px; padding: 12px; margin-top: 4px; }
    .deslizar { cursor: grab; position: relative; height: 56px; margin-top: 14px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--linea); overflow: hidden; touch-action: none; user-select: none; }
    .deslizar .relleno { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, rgba(212,175,55,.15), rgba(212,175,55,.45)); }
    .deslizar .texto { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14.5px; font-weight: 600; padding-left: 40px;
      background: linear-gradient(90deg, #78716c 0%, #f5f5f4 50%, #78716c 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brilloTexto 2.4s linear infinite; }
    .deslizar .perilla { position: absolute; top: 3px; left: 4px; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #e8c766, var(--oro));
      display: grid; place-items: center; color: #0c0a09; font-size: 22px; font-weight: 700; cursor: grab; box-shadow: 0 4px 14px rgba(0,0,0,.35); touch-action: none; }
    .deslizar.volviendo .perilla, .deslizar.volviendo .relleno { transition: all .3s ease; }
    .deslizar.listo { border-color: var(--oro); }
    .barraP { height: 10px; border-radius: 999px; background: var(--panel2); overflow: hidden; margin: 10px 0 8px; }
    .barraP div { height: 100%; width: 0; background: linear-gradient(90deg, #e8c766, var(--oro)); transition: width .12s linear; }
    .pct { color: var(--oro); font-weight: 800; font-size: 22px; margin: 0; text-align: center !important; }
    .exito { text-align: center; padding: 8px 0; }
    .exito .check { width: 64px; height: 64px; margin: 8px auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800;
      color: #0c0a09; background: linear-gradient(135deg, #e8c766, var(--oro)); box-shadow: 0 0 0 8px rgba(212,175,55,.15); }
    .exito p { margin-top: 8px; }
    .entra { animation: subirC .35s ease both; }
    @keyframes brilloTexto { from { background-position: 200% 0; } to { background-position: 0 0; } }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    @keyframes subirC { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    .dias { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin-top: 8px; scrollbar-width: thin; }
    .dia { flex: 0 0 auto; min-width: 64px; padding: 10px 8px; border-radius: 14px; border: 1px solid var(--linea); background: var(--panel2); color: #f5f5f4; font-size: 13px; text-align: center; line-height: 1.3; }
    .dia b { display: block; font-size: 18px; }
    .dia.elegido { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro); }
    .horas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .hora { padding: 11px 6px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel2); color: #f5f5f4; font-size: 14px; }
    .hora.marcado { background: #f5f5f4; color: #0c0a09; box-shadow: 0 0 0 2px var(--oro); font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { padding: 7px 11px; border-radius: 999px; background: rgba(212,175,55,.12); border: 1px solid rgba(212,175,55,.45); font-size: 13px; }
    .fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--linea); margin-top: 10px; }
    .fila .que { font-weight: 600; } .fila .est { font-size: 13px; color: var(--suave); margin-top: 2px; }
    .fila .est.ok { color: #86efac; } .fila .est.mal { color: #fca5a5; }
    .mini { padding: 9px 13px; border-radius: 10px; border: 1px solid var(--linea); background: var(--fondo); color: #f5f5f4; font-size: 13.5px; white-space: nowrap; }
    .mini.oro { background: var(--oro); color: #0c0a09; border: 0; font-weight: 700; }
    .mini.rojo { color: #fca5a5; border-color: rgba(248,113,113,.45); }
    .espacio { padding: 13px 14px; border-radius: 14px; background: var(--panel2); border: 1px solid var(--linea); margin-top: 10px; }
    .espacio.nov { border-color: rgba(248,113,113,.55); }
    .espacio .cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .espacio input[type=text] { flex: 1; min-width: 0; background: none; border: 0; color: #f5f5f4; font: inherit; font-weight: 600; font-size: 15px; padding: 2px 0; }
    .espacio input[type=text]:focus { outline: none; border-bottom: 1px solid var(--oro); }
    .tog { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
    .tog button { padding: 9px; border-radius: 10px; border: 1px solid var(--linea); background: var(--fondo); color: #d6d3d1; font-size: 13.5px; }
    .tog .si1 { background: rgba(134,239,172,.12); border-color: rgba(134,239,172,.5); color: #bbf7d0; font-weight: 600; }
    .tog .no1 { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.55); color: #fecaca; font-weight: 600; }
    .fotos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
    .fotos a { font-size: 12.5px; color: var(--oro); }
    .quitar { background: none; border: 0; color: var(--suave); font-size: 18px; padding: 0 4px; }
    .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .resumen div { padding: 10px; border-radius: 12px; background: var(--fondo); border: 1px solid rgba(255,255,255,.06); text-align: center; font-size: 12px; color: var(--suave); }
    .resumen b { display: block; font-size: 18px; color: #f5f5f4; }
  </style>
  <script src="aviso.js?v=1"></script>
</head>
<body>
  <main class="tarjeta">
    <div class="marca">GOLD LIFE <span>REAL ESTATE</span></div>
    <p id="cargando" class="centro" style="margin-top:28px;color:var(--suave);">Cargando…</p>
    <section id="error" class="oculto centro">
      <div class="icono">!</div>
      <h1 style="margin-top:8px;">No pudimos abrir esta página</h1>
      <p id="errorTexto"></p>
    </section>
    <section id="contenido" class="oculto">
      <h1 id="titulo"></h1>
      <p class="inmueble" id="inmueble"></p>
      <div id="vista"></div>
    </section>
  </main>
  <input type="file" id="archivo" class="oculto">

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbxpJ8w_XR5dUhIv1VTuV3ZDjHm-vtz13B5RlyfiLqI9ypZnIuzuUL39_GDHpBisL2oW/exec';
    const q = new URLSearchParams(location.search);
    const K = q.get('k') || '', F = q.get('f') || '', ROL = q.get('r') || '', TOKEN = q.get('t') || '';
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const primerNombre = (t) => { const x = String(t || '').trim().split(/\s+/)[0] || ''; return x.charAt(0).toUpperCase() + x.slice(1).toLowerCase(); };
    const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const textoHorario = (ts) => { const d = new Date(ts); return DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' · ' + d.toLocaleTimeString('es-CO', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/Bogota' }); };
    const ESPACIOS_BASE = ['Sala y comedor', 'Cocina', 'Habitación principal', 'Baño principal', 'Zona de ropas', 'Pisos y paredes', 'Puertas y ventanas', 'Llaves y controles'];
    let info = null, elegidos = [], diaActivo = '', cacheSlots = {};

    function llamar(accion, extra) {
      return fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ accion: accion, k: K, f: F, r: ROL, t: TOKEN }, extra || {})) }).then(r => r.json());
    }
    function error(t) { $('cargando').classList.add('oculto'); $('contenido').classList.add('oculto'); $('error').classList.remove('oculto'); $('errorTexto').textContent = t; }
    function exito(titulo, texto) {
      $('titulo').textContent = '';
      $('vista').innerHTML = `<div class="exito entra"><div class="check">✓</div><h2>${esc(titulo)}</h2><p>${esc(texto)}</p><p class="nota" style="margin-top:14px;">Ya puedes cerrar esta página.</p></div>`;
    }
    const fechasHtml = () => `<div class="fechas"><div><small>Termina el contrato</small><b>${esc(info.finTexto)}</b></div>` +
      `<div class="limite"><small>Entrega máximo</small><b>${esc(info.topeTexto)}</b></div></div>`;
    const citaHtml = () => info.cita ? `<div class="aviso oro">🗓️ La entrega quedó para el <b>${esc(textoHorario(info.cita))}</b>.</div>` : '';

    function pintar() {
      if (info.estado === 'RECIBIDO') {
        $('titulo').textContent = 'El inmueble se recibió';
        $('vista').innerHTML = fechasHtml() + '<div class="aviso oro">El recibo quedó cerrado. El informe de revisión' + (info.cierre && info.cierre.pazYSalvo ? ' y el paz y salvo' : '') + ' les llegó por correo.</div>' +
          (ROL === 'a' && info.cierre ? `<div class="chips">${info.cierre.informe ? `<a class="chip" href="${esc(info.cierre.informe)}" target="_blank">📄 Informe</a>` : ''}${info.cierre.pazYSalvo ? `<a class="chip" href="${esc(info.cierre.pazYSalvo)}" target="_blank">📄 Paz y salvo</a>` : ''}</div>` : '');
        return;
      }
      if (ROL === 'i') return pintarInquilino();
      if (ROL === 'p') return pintarPropietario();
      return pintarAgente();
    }

    // ================= Inquilino =================
    function pintarInquilino() {
      $('titulo').textContent = 'Tu sala de entrega';
      let html = fechasHtml();
      if (info.estado === 'AGENDADA') html += citaHtml();
      else if (info.pedidos.length) html += `<div class="aviso oro">Le enviaste al propietario estos horarios. Te avisamos cuando elija:<div class="chips">${info.pedidos.map(t => `<span class="chip">${esc(textoHorario(t))}</span>`).join('')}</div></div>`;
      else html += '<p class="rotulo">1 · Propón 3 horarios para la entrega</p><p class="nota">El propietario elige uno. Debe ser antes del ' + esc(info.topeTexto) + '.</p><div class="dias" id="dias"></div><div id="horasDia"></div>' +
        '<div class="chips" id="elegidos"></div><button class="principal bloqueado" id="bEnviar">Enviar horarios</button>';
      html += '<p class="rotulo">' + (info.estado === 'AGENDADA' || info.pedidos.length ? '' : '2 · ') + 'Recibos pagados de servicios</p><p class="nota">Con ellos se da el paz y salvo. Sube el último recibo pagado de cada uno.</p>' +
        Object.keys(info.servicios).map(filaRecibo).join('');
      $('vista').innerHTML = html;
      if ($('dias')) pintarDias();
      activarRecibos();
    }
    function estadoRecibo(x) {
      if (!x) return ['Sin cargar', ''];
      return { CARGADO: ['Cargado · Leonardo lo revisa', ''], APROBADO: ['Aprobado ✓', 'ok'], NO_APLICA: ['No aplica', 'ok'], NO_ES: ['Devuelto: ' + (x.motivo || ''), 'mal'] }[x.estado] || [x.estado, ''];
    }
    function filaRecibo(s) {
      const x = info.recibos[s], [txt, cls] = estadoRecibo(x);
      const puede = !x || x.estado === 'NO_ES' || x.estado === 'CARGADO' || x.estado === 'NO_APLICA';
      return `<div class="fila"><div><div class="que">${esc(info.servicios[s])}</div><div class="est ${cls}">${esc(txt)}</div></div><div style="display:flex;gap:6px;">` +
        (s === 'GAS' && !x ? '<button class="mini" data-noaplica="GAS">No tiene gas</button>' : '') +
        (puede ? `<button class="mini oro" data-sub="${s}">${x && x.estado !== 'NO_APLICA' ? 'Cambiar' : 'Subir'}</button>` : '') + '</div></div>';
    }
    function activarRecibos() {
      $('vista').querySelectorAll('[data-sub]').forEach(b => b.onclick = () => elegirArchivo('image/*,application/pdf', (d) => {
        b.disabled = true; b.textContent = 'Subiendo…';
        llamar('cargarReciboServicio', Object.assign({ servicio: b.dataset.sub }, d)).then(r => { if (!r.ok) alert(r.mensaje); recargar(); }).catch(() => { alert('Error de red. Intenta de nuevo.'); recargar(); });
      }));
      $('vista').querySelectorAll('[data-noaplica]').forEach(b => b.onclick = () => {
        b.disabled = true;
        llamar('cargarReciboServicio', { servicio: 'GAS', noAplica: true }).then(r => { if (!r.ok) alert(r.mensaje); recargar(); });
      });
    }
    function pintarDias() {
      const d0 = new Date(info.desde + 'T12:00:00'), d1 = new Date(info.hasta + 'T12:00:00');
      const lista = [];
      for (let d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) if (d.getDay() !== 0) lista.push(new Date(d));
      $('dias').innerHTML = lista.map(d => { const iso = d.toISOString().slice(0, 10); return `<button class="dia${iso === diaActivo ? ' elegido' : ''}" data-d="${iso}">${DIAS[d.getDay()]}<b>${d.getDate()}</b>${MESES[d.getMonth()].slice(0, 3)}</button>`; }).join('');
      $('dias').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { diaActivo = b.dataset.d; pintarDias(); cargarHoras(); });
      pintarElegidos();
    }
    function cargarHoras() {
      const dia = diaActivo;
      const mostrar = (slots) => {
        if (dia !== diaActivo) return;
        $('horasDia').innerHTML = slots.length ? '<div class="horas">' + slots.map(s => `<button class="hora${elegidos.includes(s.timestamp) ? ' marcado' : ''}" data-ts="${s.timestamp}">${esc(s.horaAmPm)}</button>`).join('') + '</div>'
          : '<p class="nota centro" style="margin-top:10px;">No hay horarios libres ese día.</p>';
        $('horasDia').querySelectorAll('[data-ts]').forEach(b => b.onclick = () => {
          const ts = Number(b.dataset.ts);
          if (elegidos.includes(ts)) elegidos = elegidos.filter(x => x !== ts);
          else if (elegidos.length < 3) elegidos.push(ts);
          b.classList.toggle('marcado', elegidos.includes(ts)); pintarElegidos();
        });
      };
      if (cacheSlots[dia]) return mostrar(cacheSlots[dia]);
      $('horasDia').innerHTML = '<p class="nota centro" style="margin-top:10px;">Buscando horarios…</p>';
      llamar('disponibilidadRecibo', { fecha: dia }).then(r => { cacheSlots[dia] = r && r.success ? r.slots || [] : []; mostrar(cacheSlots[dia]); })
        .catch(() => { $('horasDia').innerHTML = '<p class="error">Error de red.</p>'; });
    }
    function pintarElegidos() {
      elegidos.sort((a, b) => a - b);
      $('elegidos').innerHTML = elegidos.map(t => `<span class="chip">${esc(textoHorario(t))}</span>`).join('');
      $('bEnviar').classList.toggle('bloqueado', elegidos.length !== 3);
      $('bEnviar').textContent = elegidos.length === 3 ? 'Enviar horarios' : 'Elige ' + (3 - elegidos.length) + ' horario' + (3 - elegidos.length === 1 ? '' : 's') + ' más';
      $('bEnviar').onclick = () => {
        if (elegidos.length !== 3) return;
        $('bEnviar').disabled = true; $('bEnviar').textContent = 'Enviando…';
        llamar('proponerRecibo', { pedidos: elegidos }).then(r => {
          if (!r.ok) { alert(r.mensaje); cacheSlots = {}; elegidos = []; return recargar(); }
          elegidos = []; recargar();
        }).catch(() => { alert('Error de red. Intenta de nuevo.'); $('bEnviar').disabled = false; pintarElegidos(); });
      };
    }

    // ================= Propietario =================
    function pintarPropietario() {
      $('titulo').textContent = 'Recibo de tu inmueble';
      if (info.estado === 'AGENDADA') { $('vista').innerHTML = fechasHtml() + citaHtml() + '<p class="nota centro" style="margin-top:12px;">Leonardo va a estar en el recibo.</p>'; return; }
      if (!info.pedidos.length) { $('vista').innerHTML = fechasHtml() + `<div class="aviso oro">Estamos esperando que ${esc(primerNombre(info.inquilino))} proponga horarios. Te avisamos por correo.</div>`; return; }
      $('vista').innerHTML = fechasHtml() + `<p class="rotulo">${esc(primerNombre(info.inquilino))} propuso estos horarios</p><p class="nota">Elige el que te sirva para recibir tu inmueble.</p>` +
        info.pedidos.map(t => `<div class="fila"><div class="que">${esc(textoHorario(t))}</div><button class="mini oro" data-ts="${t}">Me sirve</button></div>`).join('') +
        '<button class="volver" id="bNinguno">Ninguno me sirve</button>';
      $('vista').querySelectorAll('[data-ts]').forEach(b => b.onclick = () => {
        const ts = Number(b.dataset.ts);
        const c = capa(`<div class="icono">🔑</div><h3>¿Recibir el ${esc(textoHorario(ts))}?</h3><p>Queda agendado en el calendario y les avisamos a los dos. Leonardo va a estar en el recibo.</p>` +
          deslizador('Desliza para confirmar') + '<button class="si oculto">Agendar el recibo</button><button class="no">Volver</button>');
        activarDeslizador(c);
        c.querySelector('.no').onclick = () => c.remove();
        c.querySelector('.si').onclick = () => { c.remove(); proceso('Agendando el recibo', 'responderRecibo', { timestamp: ts }, 'Recibo agendado'); };
      });
      $('bNinguno').onclick = () => {
        const c = capa(`<div class="icono">🗓️</div><h3>¿Ninguno te sirve?</h3><p>Le pedimos a ${esc(primerNombre(info.inquilino))} que proponga otros 3 horarios.</p><button class="si">Pedir otros horarios</button><button class="no">Volver</button>`);
        c.querySelector('.no').onclick = () => c.remove();
        c.querySelector('.si').onclick = () => { c.remove(); llamar('responderRecibo', { ninguno: true }).then(r => r.ok ? exito('Listo', r.mensaje) : alert(r.mensaje)); };
      };
    }

    // ================= Leonardo =================
    let espacios = null;
    function pintarAgente() {
      $('titulo').textContent = 'Sala de recibo';
      if (!espacios) espacios = info.espacios.length ? info.espacios : ESPACIOS_BASE.map(n => ({ nombre: n, estado: 'CONFORME', nota: '', fotos: [] }));
      const recibos = Object.keys(info.servicios).map(s => {
        const x = info.recibos[s], [txt, cls] = estadoRecibo(x);
        return `<div class="fila"><div><div class="que">${esc(info.servicios[s])}</div><div class="est ${cls}">${esc(txt)}</div></div><div style="display:flex;gap:6px;">` +
          (x && x.url ? `<a class="mini" href="${esc(x.url)}" target="_blank">Ver</a>` : '') +
          (x && x.estado === 'CARGADO' ? `<button class="mini rojo" data-noes="${s}">No es</button><button class="mini oro" data-ok="${s}">Aprobar</button>` : '') + '</div></div>';
      }).join('');
      $('vista').innerHTML = fechasHtml() + citaHtml() +
        `<p class="nota" style="margin-top:12px;">👤 ${esc(info.inquilino)} · 🏠 ${esc(info.propietario)}</p>` +
        '<p class="rotulo">Recibos de servicios</p>' + recibos +
        '<p class="rotulo">Inventario</p>' + (info.inventario ? `<a class="chip" href="${esc(info.inventario)}" target="_blank">📋 Ver el inventario de la entrega</a>` : '<p class="nota">No encontré el PDF del inventario en Drive.</p>') +
        '<div id="espacios"></div><button class="volver" id="bAgregar">+ Agregar espacio</button>' +
        '<div class="resumen" id="resumen"></div>' +
        '<button class="principal" id="bCerrar">Se recibió el inmueble</button><p class="nota centro" id="notaPaz"></p>';
      $('vista').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { b.disabled = true; llamar('revisarReciboServicio', { servicio: b.dataset.ok, aprobar: true }).then(r => { if (!r.ok) alert(r.mensaje); recargar(); }); });
      $('vista').querySelectorAll('[data-noes]').forEach(b => b.onclick = () => {
        const motivo = prompt('¿Qué le falta al recibo de ' + info.servicios[b.dataset.noes].toLowerCase() + '? (le llega al inquilino)');
        if (!motivo || !motivo.trim()) return;
        llamar('revisarReciboServicio', { servicio: b.dataset.noes, aprobar: false, motivo: motivo }).then(r => { if (!r.ok) alert(r.mensaje); recargar(); });
      });
      $('bAgregar').onclick = () => { espacios.push({ nombre: '', estado: 'CONFORME', nota: '', fotos: [] }); pintarEspacios(); const ins = $('espacios').querySelectorAll('input[type=text]'); ins[ins.length - 1].focus(); };
      $('bCerrar').onclick = confirmarCierre;
      pintarEspacios();
    }
    function pintarEspacios() {
      $('espacios').innerHTML = espacios.map((e, i) => `<div class="espacio${e.estado === 'NOVEDAD' ? ' nov' : ''}"><div class="cab"><input type="text" data-n="${i}" value="${esc(e.nombre)}" placeholder="Nombre del espacio" maxlength="60"><button class="quitar" data-q="${i}" title="Quitar">×</button></div>` +
        `<div class="tog"><button data-c="${i}" class="${e.estado === 'CONFORME' ? 'si1' : ''}">✓ Conforme</button><button data-v="${i}" class="${e.estado === 'NOVEDAD' ? 'no1' : ''}">⚠ Novedad</button></div>` +
        `<textarea data-t="${i}" maxlength="500" placeholder="${e.estado === 'NOVEDAD' ? 'Describe la novedad (obligatorio)' : 'Nota (opcional)'}">${esc(e.nota)}</textarea>` +
        `<div class="fotos">${e.fotos.map((u, k) => `<a href="${esc(u)}" target="_blank">📷 foto ${k + 1}</a>`).join('')}<button class="mini" data-f="${i}">📷 Foto</button></div></div>`).join('');
      const qq = (s) => $('espacios').querySelectorAll(s);
      qq('[data-n]').forEach(x => x.oninput = () => { espacios[x.dataset.n].nombre = x.value; });
      qq('[data-t]').forEach(x => x.oninput = () => { espacios[x.dataset.t].nota = x.value; resumen(); });
      qq('[data-c]').forEach(x => x.onclick = () => { espacios[x.dataset.c].estado = 'CONFORME'; pintarEspacios(); guardar(); });
      qq('[data-v]').forEach(x => x.onclick = () => { espacios[x.dataset.v].estado = 'NOVEDAD'; pintarEspacios(); $('espacios').querySelector(`[data-t="${x.dataset.v}"]`).focus(); });
      qq('[data-q]').forEach(x => x.onclick = () => { espacios.splice(Number(x.dataset.q), 1); pintarEspacios(); guardar(); });
      qq('[data-f]').forEach(x => x.onclick = () => elegirArchivo('image/*', (d) => {
        x.disabled = true; x.textContent = 'Subiendo…';
        const e = espacios[x.dataset.f];
        llamar('subirFotoRecibo', Object.assign({ espacio: e.nombre }, d)).then(r => { if (!r.ok) alert(r.mensaje); else e.fotos.push(r.url); pintarEspacios(); guardar(); })
          .catch(() => { alert('Error de red.'); pintarEspacios(); });
      }, true));
      qq('textarea, input[type=text]').forEach(x => x.onblur = guardar);
      resumen();
    }
    function resumen() {
      const nov = espacios.filter(e => e.estado === 'NOVEDAD').length;
      const ok = Object.keys(info.servicios).every(s => info.recibos[s] && ['APROBADO', 'NO_APLICA'].includes(info.recibos[s].estado));
      $('resumen').innerHTML = `<div><b>${espacios.length - nov}</b>conformes</div><div><b style="color:${nov ? '#fca5a5' : '#f5f5f4'}">${nov}</b>novedades</div><div><b>${ok ? '✓' : '—'}</b>recibos</div>`;
      $('notaPaz').textContent = nov ? 'Con novedades no sale el paz y salvo: sale solo el informe.' : !ok ? 'Faltan recibos aprobados: sale solo el informe, sin paz y salvo.'
        : 'Sale el informe y el paz y salvo, firmado por ' + (info.firmante === 'AGENTE' ? 'ti' : 'el propietario') + '.';
    }
    let guardando = Promise.resolve();
    function guardar() {
      const lista = espacios.filter(e => e.nombre.trim());
      guardando = guardando.then(() => llamar('guardarInventarioRecibo', { espacios: lista }).then(r => { if (!r.ok) { alert(r.mensaje); return Promise.reject(); } }));
      return guardando.catch(() => { guardando = Promise.resolve(); return Promise.reject(); });
    }
    function confirmarCierre() {
      if (espacios.some(e => e.estado === 'NOVEDAD' && !e.nota.trim())) return alert('Cada novedad necesita una nota.');
      const nov = espacios.filter(e => e.estado === 'NOVEDAD').length;
      const c = capa('<div class="icono">🔑</div><h3>¿Se recibió el inmueble?</h3>' +
        `<p>Se envía a las dos partes el <b>informe de revisión</b> (${espacios.length - nov} conformes, ${nov} novedades)${$('notaPaz').textContent.indexOf('paz y salvo, firmado') !== -1 ? ' y el <b>paz y salvo</b>' : ''}.</p>` +
        '<p>Se apagan los cobros mes a mes y el inmueble queda <b>pendiente</b> para volver a publicarse. No se puede deshacer.</p>' +
        deslizador('Desliza para cerrar') + '<button class="si oculto">Cerrar el recibo</button><button class="no">Volver</button>');
      activarDeslizador(c);
      c.querySelector('.no').onclick = () => c.remove();
      c.querySelector('.si').onclick = () => { c.remove(); guardar().then(() => proceso('Cerrando el recibo', 'cerrarRecibo', {}, 'Inmueble recibido')).catch(() => {}); };
    }

    // ================= Archivos =================
    function elegirArchivo(accept, listo, foto) {
      const inp = $('archivo'); inp.value = ''; inp.accept = accept;
      inp.onchange = () => {
        const a = inp.files[0]; if (!a) return;
        if (a.size > 15 * 1024 * 1024) return alert('El archivo pesa más de 15 MB.');
        if (/^image\//.test(a.type)) return reducir(a, foto ? 1600 : 2200).then(listo);
        const r = new FileReader();
        r.onload = () => listo({ base64: String(r.result).split(',')[1], mimeType: a.type, nombre: a.name });
        r.readAsDataURL(a);
      };
      inp.click();
    }
    // Las fotos del celular pesan mucho: se reducen antes de subir
    function reducir(a, lado) {
      return new Promise((res) => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, lado / Math.max(img.width, img.height));
          const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          res({ base64: cv.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg', nombre: a.name.replace(/\.\w+$/, '') + '.jpg' });
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(a);
      });
    }

    function proceso(titulo, accion, extra, tituloOk) {
      const pr = progresoReal(titulo);
      llamar(accion, Object.assign({ prog: pr.prog }, extra))
        .then(r => pr.fin(r && r.ok).then(() => r))
        .then(r => r.ok ? exito(tituloOk, r.mensaje || '') : alert(r.mensaje || 'No pudimos hacerlo.'))
        .catch(() => { pr.fin(false); alert('Error de red. Intenta de nuevo.'); });
    }

    // ================= Piezas: modal, deslizador y barra de avance real =================
    function capa(html) {
      // Un solo modal a la vez (un doble toque no abre dos)
      document.querySelectorAll('.confirmar').forEach(x => x.remove());
      const c = document.createElement('div'); c.className = 'confirmar'; c.innerHTML = `<div class="caja" role="dialog" aria-modal="true">${html}</div>`;
      document.body.appendChild(c); return c;
    }
    const deslizador = (t) => `<div class="deslizar"><div class="relleno"></div><div class="texto">${t}</div><div class="perilla">›</div></div>`;
    function activarDeslizador(c) {
      const qq = (s) => c.querySelector(s);
      const pista = qq('.deslizar'), perilla = qq('.perilla'), relleno = qq('.relleno');
      let x0 = null, max = 0;
      const mover = (x) => { const d = Math.max(0, Math.min(max, x - x0)); perilla.style.transform = `translateX(${d}px)`; relleno.style.width = (d + 28) + 'px'; return d; };
      pista.addEventListener('pointerdown', (e) => {
        if (pista.classList.contains('listo')) return;
        e.preventDefault();
        x0 = perilla.getBoundingClientRect().left + perilla.offsetWidth / 2; max = pista.clientWidth - perilla.offsetWidth - 8; pista.classList.remove('volviendo');
        try { pista.setPointerCapture(e.pointerId); } catch (_) {}
        mover(e.clientX);
      });
      pista.addEventListener('pointermove', (e) => { if (x0 !== null) mover(e.clientX); });
      const soltar = (e) => {
        if (x0 === null) return;
        const d = mover(e.clientX); x0 = null;
        if (d >= max * 0.8) {
          perilla.style.transform = `translateX(${max}px)`; relleno.style.width = '100%';
          pista.classList.add('listo'); perilla.textContent = '✓'; qq('.texto').textContent = 'Listo';
          qq('.si').classList.remove('oculto'); qq('.si').classList.add('entra');
        } else { pista.classList.add('volviendo'); perilla.style.transform = ''; relleno.style.width = '0'; }
      };
      pista.addEventListener('pointerup', soltar); pista.addEventListener('pointercancel', soltar);
      pista.addEventListener('dragstart', (e) => e.preventDefault());
    }
    // El servidor anota en qué etapa va (progresoSala) y la barra lo sigue
    function progresoReal(titulo) {
      const prog = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
      const c = capa(`<div class="icono">📄</div><h3>${esc(titulo)}…</h3><p class="pct" id="pct">0 %</p><div class="barraP"><div id="barraP"></div></div><p class="nota centro" id="etapaP">Iniciando…</p>`);
      let v = 0, meta = 3, activo = true;
      const pintarV = () => { c.querySelector('#pct').textContent = Math.round(v) + ' %'; c.querySelector('#barraP').style.width = v + '%'; };
      const t = setInterval(() => { if (v < meta) { v = Math.min(meta, v + Math.max(0.4, (meta - v) * 0.15)); pintarV(); } }, 120);
      const consultar = () => {
        if (!activo) return;
        fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'progresoSala', prog: prog }) }).then(r => r.json()).then(r => {
          if (!activo || !r || !r.ok) return;
          if (r.pct > meta) meta = Math.min(r.pct, 97);
          if (r.texto) c.querySelector('#etapaP').textContent = r.texto + '…';
        }).catch(() => {}).finally(() => { if (activo) setTimeout(consultar, 1000); });
      };
      setTimeout(consultar, 600);
      return {
        prog: prog,
        fin(ok) {
          activo = false; clearInterval(t);
          if (!ok) { c.remove(); return Promise.resolve(); }
          c.querySelector('#etapaP').textContent = '¡Listo!';
          return new Promise(res => { const s = setInterval(() => { v = Math.min(100, v + 4); pintarV(); if (v >= 100) { clearInterval(s); setTimeout(() => { c.remove(); res(); }, 450); } }, 30); });
        }
      };
    }

    function recargar() {
      return llamar('infoRecibo').then(r => {
        if (!r || !r.ok) return error((r && r.mensaje) || 'No pudimos abrir esta página.');
        info = r;
        $('cargando').classList.add('oculto'); $('contenido').classList.remove('oculto');
        $('inmueble').textContent = '📍 ' + info.direccion;
        pintar();
      }).catch(() => error('Revisa tu conexión a internet e intenta de nuevo.'));
    }
    if (!K || !F || !ROL || !TOKEN) error('El enlace está incompleto.'); else recargar();
  </script>
