<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nuevo año del contrato · Gold Life Real Estate</title>
  <!--
    El año nuevo de un contrato renovado (etapa 3, parte 2 · 28-oct-2026): ?k=<inmueble>&a=<año del contrato>&r=p|a&t=<token>.
    a = Leonardo: escribe el IPC del año y aprueba (o pide corrección). p = el propietario: administración nueva y recibo.
    Servidor: backend/AJUSTE_ANUAL_IPC.js. Estilos y piezas de renovacion.html.
  -->
  <style>
    :root { --oro: #d4af37; --fondo: #0c0a09; --panel: #1c1917; --panel2: #292524; --suave: #a8a29e; --linea: #3f3a36; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px 40px; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--fondo); color: #f5f5f4;
      background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212,175,55,.16), transparent 70%);
    }
    .tarjeta {
      width: 100%; max-width: 560px; margin: 0 auto; background: var(--panel); border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px; padding: clamp(22px, 5vw, 32px) clamp(16px, 4.5vw, 28px); box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .marca { font-size: 12px; letter-spacing: 3px; font-weight: 700; color: var(--oro); text-align: center; }
    .marca span { color: var(--suave); font-weight: 400; }
    h1 { margin: 22px 0 6px; font-size: clamp(20px, 5vw, 24px); font-weight: 600; text-align: center; }
    h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
    p { margin: 0; line-height: 1.6; color: #d6d3d1; }
    .centro { text-align: center; }
    .inmueble { color: var(--suave); font-size: 14px; text-align: center; margin-bottom: 18px; }
    .nota { font-size: 13px; color: var(--suave); margin-top: 6px; }
    .oculto { display: none !important; }
    button { font-family: inherit; cursor: pointer; transition: opacity .2s, transform .1s, background .15s; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: default; }
    .icono { width: 56px; height: 56px; margin: 20px auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px;
      background: rgba(212,175,55,.1); box-shadow: 0 0 0 1px rgba(212,175,55,.3); }
    .aviso { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.55; }
    .aviso.oro { background: rgba(212,175,55,.1); border: 1px solid rgba(212,175,55,.45); color: #f5f5f4; }
    .aviso.rojo { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.45); color: #fecaca; }
    .tabla { margin-top: 10px; display: grid; gap: 8px; }
    .tabla div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--fondo); border: 1px solid rgba(255,255,255,.06); font-size: 14.5px; }
    .tabla span { color: var(--suave); } .tabla b { text-align: right; } .tabla s { display: block; color: #78716c; font-weight: 400; font-size: 12.5px; }
    .tabla .total { border-color: rgba(212,175,55,.45); } .tabla .total b { color: var(--oro); font-size: 16px; }
    .rotulo { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--suave); font-weight: 700; margin: 20px 0 0; }
    input { width: 100%; padding: 13px 14px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel2); color: #f5f5f4; font-size: 16px; font-family: inherit; }
    input:focus { outline: none; border-color: var(--oro); }
    textarea { width: 100%; min-height: 76px; padding: 12px; border-radius: 12px; border: 1px solid var(--linea); background: var(--panel2); color: #f5f5f4; font: inherit; font-size: 14.5px; margin-top: 4px; }
    textarea:focus { outline: none; border-color: var(--oro); }
    .zona { display: block; margin-top: 14px; border: 1.5px dashed rgba(212,175,55,.6); border-radius: 16px; padding: 18px 14px; text-align: center; cursor: pointer; background: rgba(212,175,55,.05); }
    .zona b { color: var(--oro); } .zona.lista { border-style: solid; }
    .previa { max-width: 100%; max-height: 220px; border-radius: 12px; margin-top: 10px; }
    .ver { display: block; margin-top: 12px; text-align: center; padding: 13px; border-radius: 12px; border: 1px solid var(--linea); color: #f5f5f4; text-decoration: none; background: var(--panel2); }
    .botones2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .botones2 button { padding: 14px 8px; border-radius: 12px; font-size: 15px; font-weight: 700; border: 0; }
    .aprobar { background: linear-gradient(135deg, #e8c766, var(--oro)); color: #0c0a09; }
    .corregir { background: var(--panel2); color: #fca5a5; border: 1px solid rgba(248,113,113,.45) !important; }
    .principal { width: 100%; padding: 15px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; color: #0c0a09; background: linear-gradient(135deg, #e8c766, var(--oro)); margin-top: 18px; }
    .principal.bloqueado { opacity: .55; filter: grayscale(.4); }
    .error { color: #fca5a5; font-size: 14px; margin-top: 10px; text-align: center; }
    .confirmar { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.72); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 20px; animation: aparecer .25s ease; }
    .confirmar .caja { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--linea); border-radius: 22px;
      padding: 24px 22px 18px; text-align: center; animation: subirC .3s ease; }
    .confirmar .icono { font-size: 30px; margin: 0 auto 8px; }
    .confirmar h3 { margin: 0 0 8px; font-size: 19px; }
    .confirmar p { color: #d6d3d1; font-size: 14px; line-height: 1.55; margin: 0 0 10px; text-align: left; }
    .confirmar .si { margin-top: 14px; width: 100%; border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; background: var(--oro); color: #0c0a09; }
    .confirmar .no { width: 100%; border: 0; background: none; color: var(--suave); font-size: 14px; padding: 12px; margin-top: 4px; }
    .deslizar { cursor: grab; position: relative; height: 56px; margin-top: 14px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--linea); overflow: hidden; touch-action: none; user-select: none; }
    .deslizar .relleno { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, rgba(212,175,55,.15), rgba(212,175,55,.45)); }
    .deslizar .texto { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14.5px; font-weight: 600; padding-left: 40px;
      background: linear-gradient(90deg, #78716c 0%, #f5f5f4 50%, #78716c 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: brilloTexto 2.4s linear infinite; }
    .deslizar .perilla { position: absolute; top: 3px; left: 4px; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #e8c766, var(--oro));
      display: grid; place-items: center; color: #0c0a09; font-size: 22px; font-weight: 700; cursor: grab; box-shadow: 0 4px 14px rgba(0,0,0,.35); touch-action: none; }
    .deslizar.volviendo .perilla, .deslizar.volviendo .relleno { transition: all .3s ease; }
    .deslizar.listo { border-color: var(--oro); }
    .barraP { height: 10px; border-radius: 999px; background: var(--panel2); overflow: hidden; margin: 10px 0 8px; }
    .barraP div { height: 100%; width: 0; background: linear-gradient(90deg, #e8c766, var(--oro)); transition: width .12s linear; }
    .pct { color: var(--oro); font-weight: 800; font-size: 22px; margin: 0; text-align: center !important; }
    .exito { text-align: center; padding: 8px 0; }
    .exito .check { width: 64px; height: 64px; margin: 8px auto 14px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800;
      color: #0c0a09; background: linear-gradient(135deg, #e8c766, var(--oro)); box-shadow: 0 0 0 8px rgba(212,175,55,.15); }
    .exito p { margin-top: 8px; }
    .entra { animation: subirC .35s ease both; }
    @keyframes brilloTexto { from { background-position: 200% 0; } to { background-position: 0 0; } }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
    @keyframes subirC { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  </style>
  <script src="aviso.js?v=1"></script>
</head>
<body>
  <main class="tarjeta">
    <div class="marca">GOLD LIFE <span>REAL ESTATE</span></div>
    <p id="cargando" class="centro" style="margin-top:28px;color:var(--suave);">Cargando…</p>
    <section id="error" class="oculto centro">
      <div class="icono">!</div>
      <h1 style="margin-top:8px;">No pudimos abrir esta página</h1>
      <p id="errorTexto"></p>
    </section>
    <section id="contenido" class="oculto">
      <h1 id="titulo"></h1>
      <p class="inmueble" id="inmueble"></p>
      <div id="vista"></div>
    </section>
  </main>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbxpJ8w_XR5dUhIv1VTuV3ZDjHm-vtz13B5RlyfiLqI9ypZnIuzuUL39_GDHpBisL2oW/exec';
    const q = new URLSearchParams(location.search);
    const K = q.get('k') || '', A = q.get('a') || '', ROL = q.get('r') || '', TOKEN = q.get('t') || '';
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const miles = (n) => '$ ' + Math.round(Number(n) || 0).toLocaleString('es-CO');
    const primerNombre = (t) => { const x = String(t || '').trim().split(/\s+/)[0] || ''; return x.charAt(0).toUpperCase() + x.slice(1).toLowerCase(); };
    let info = null, archivo = null;

    function llamar(accion, extra) {
      return fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ accion: accion, k: K, a: A, r: ROL, t: TOKEN }, extra || {})) }).then(r => r.json());
    }
    function error(t) { $('cargando').classList.add('oculto'); $('contenido').classList.add('oculto'); $('error').classList.remove('oculto'); $('errorTexto').textContent = t; }
    function exito(titulo, texto) {
      $('titulo').textContent = '';
      $('vista').innerHTML = `<div class="exito entra"><div class="check">✓</div><h2>${esc(titulo)}</h2><p>${esc(texto)}</p><p class="nota" style="margin-top:14px;">Ya puedes cerrar esta página.</p></div>`;
    }
    const aviso = (t, clase) => `<div class="aviso ${clase || 'oro'}">${t}</div>`;
    function mostrarError(t) { $('err').textContent = t; $('err').classList.remove('oculto'); }
    function tablaValores(conAdmin) {
      return '<div class="tabla">' +
        `<div><span>Canon<br><small>IPC ${esc(info.anioIpc)}: ${esc(String(info.ipc).replace('.', ','))}%</small></span><b><s>${miles(info.canonAnterior)}</s>${miles(info.canonNuevo)}</b></div>` +
        (conAdmin ? `<div><span>Administración</span><b><s>${miles(info.adminAnterior)}</s>${miles(info.adminNueva)}</b></div>` +
          `<div class="total"><span>Total mensual</span><b>${miles(info.canonNuevo + info.adminNueva)}</b></div>` : '') + '</div>';
    }

    // ================= Leonardo =================
    function vistaAgente() {
      const e = info.estado;
      if (e === 'ESPERANDO_IPC') {
        $('titulo').textContent = 'IPC del año ' + info.anioIpc;
        $('vista').innerHTML = `<p class="nota centro">El contrato se renovó y su nuevo año empieza el <b>${esc(info.desdeTexto)}</b>. Escribe el IPC de ${esc(info.anioIpc)}: la <b>variación anual a diciembre</b> que publica el DANE. Sirve para todos los contratos de ese año.</p>` +
          '<input id="ipc" inputmode="decimal" placeholder="Ej.: 5,2"><button class="principal bloqueado" id="bIpc">Guardar el IPC</button><p class="error oculto" id="err"></p>';
        const valido = () => /^\d{1,2}([.,]\d{1,3})?$/.test($('ipc').value.trim());
        $('ipc').oninput = () => $('bIpc').classList.toggle('bloqueado', !valido());
        $('bIpc').onclick = () => {
          if (!valido()) return;
          const b = $('bIpc'); b.disabled = true; b.textContent = 'Guardando…';
          llamar('guardarIpcAjuste', { ipc: $('ipc').value.trim() }).then(r => {
            if (!r.ok) { b.disabled = false; b.textContent = 'Guardar el IPC'; return mostrarError(r.mensaje); }
            exito('IPC guardado', r.mensaje);
          }).catch(() => { b.disabled = false; b.textContent = 'Guardar el IPC'; mostrarError('Error de red. Intenta de nuevo.'); });
        };
        return;
      }
      $('titulo').textContent = 'Nuevo año del contrato';
      if (e === 'ESPERANDO_PROPIETARIO' || e === 'CORREGIR') {
        $('vista').innerHTML = tablaValores(false) + aviso(e === 'CORREGIR'
          ? 'Le pediste una corrección a ' + esc(primerNombre(info.propietario)) + ': <em>“' + esc(info.comentario) + '”</em>. Te avisamos cuando la envíe.'
          : 'Esperando a que ' + esc(primerNombre(info.propietario)) + ' escriba la administración nueva y cargue el recibo.');
        return;
      }
      if (e === 'APROBADO') {
        $('vista').innerHTML = tablaValores(true) + aviso('Aprobado. Al inquilino le llegó el acta con los valores del nuevo año.') +
          (info.acta ? `<a class="ver" href="${esc(info.acta)}" target="_blank" rel="noopener">📄 Ver el acta de incremento</a>` : '');
        return;
      }
      // REVISION
      $('vista').innerHTML = `<p class="nota centro">${esc(primerNombre(info.propietario))} completó los valores desde el <b>${esc(info.desdeTexto)}</b> (mes ${esc(info.mesDesde)}).</p>` + tablaValores(true) +
        (info.recibo ? `<a class="ver" href="${esc(info.recibo)}" target="_blank" rel="noopener">🧾 Ver el recibo de administración</a>` : '') +
        '<div class="botones2"><button class="corregir" id="bCorregir">✏️ Pedir corrección</button><button class="aprobar" id="bAprobar">✓ Aprobar</button></div>';
      $('bAprobar').onclick = () => {
        const c = capa('<div class="icono">📈</div><h3>¿Aprobar los valores?</h3>' +
          `<p>Le enviamos a ${esc(primerNombre(info.inquilino))} el acta de incremento: desde el <b>${esc(info.desdeTexto)}</b> paga <b>${miles(info.canonNuevo + info.adminNueva)}</b> al mes.</p>` +
          deslizador('Desliza para aprobar') + '<button class="si oculto">Aprobar y avisar</button><button class="no">Volver</button>');
        activarDeslizador(c);
        c.querySelector('.no').onclick = () => c.remove();
        c.querySelector('.si').onclick = () => { c.remove(); revisar({ decision: 'APROBAR' }, 'Aprobando'); };
      };
      $('bCorregir').onclick = () => {
        const c = capa('<div class="icono">✏️</div><h3>¿Qué hay que corregir?</h3>' +
          `<p>Se lo pedimos a ${esc(primerNombre(info.propietario))}.</p><textarea id="coment" maxlength="300" placeholder="Ej.: el recibo no se ve / el valor no coincide"></textarea>` +
          '<button class="si">Pedir la corrección</button><button class="no">Volver</button>');
        c.querySelector('.no').onclick = () => c.remove();
        c.querySelector('.si').onclick = () => {
          const t = c.querySelector('#coment').value.trim(); if (!t) return c.querySelector('#coment').focus();
          c.remove(); revisar({ decision: 'CORREGIR', comentario: t }, 'Enviando la corrección');
        };
      };
    }
    function revisar(extra, titulo) {
      const pr = progresoReal(titulo);
      llamar('revisarAjusteAnual', Object.assign({ prog: pr.prog }, extra)).then(r => pr.fin(r && r.ok).then(() => r)).then(r => {
        if (!r.ok) return alert(r.mensaje || 'No pudimos guardar.');
        exito(extra.decision === 'APROBAR' ? 'Aprobado' : 'Corrección enviada', r.mensaje || '');
      }).catch(() => { pr.fin(false); alert('Error de red. Intenta de nuevo.'); });
    }

    // ================= El propietario =================
    function vistaPropietario() {
      const e = info.estado;
      $('titulo').textContent = 'Nuevo año de tu contrato';
      if (e === 'ESPERANDO_IPC') { $('vista').innerHTML = aviso('Estamos preparando el canon del nuevo año. Te avisamos por correo.'); return; }
      if (e === 'REVISION') { $('vista').innerHTML = tablaValores(true) + aviso('Leonardo está revisando los valores. Te avisamos cuando queden aprobados.'); return; }
      if (e === 'APROBADO') { exito('Valores aprobados', 'Le enviamos al inquilino el acta con los valores del nuevo año.'); return; }
      $('vista').innerHTML = `<p class="nota centro">Tu contrato se renovó. El nuevo año empieza el <b>${esc(info.desdeTexto)}</b>.</p>` +
        (e === 'CORREGIR' ? aviso('Leonardo te pide una corrección: <em>“' + esc(info.comentario) + '”</em>', 'rojo') : '') +
        tablaValores(false) +
        '<p class="rotulo">Administración plena del nuevo año</p>' +
        `<input id="admin" inputmode="numeric" placeholder="Valor mensual" value="${info.adminNueva !== null ? Math.round(info.adminNueva).toLocaleString('es-CO') : ''}">` +
        `<p class="nota">Año anterior: ${miles(info.adminAnterior)}</p>` +
        '<label class="zona" id="zona"><input type="file" id="archivo" accept="image/*,application/pdf" hidden>' +
        `<div style="font-size:28px;">📎</div><b>${info.recibo ? 'Cambiar el recibo de administración' : 'Carga el recibo de administración'}</b><p class="nota" style="margin-top:4px;">Foto o PDF del recibo de este año</p><div id="previa"></div></label>` +
        '<button class="principal bloqueado" id="bEnviar">Enviar a revisión</button><p class="error oculto" id="err"></p>';
      const listo = () => $('bEnviar').classList.toggle('bloqueado', !$('admin').value.replace(/\D/g, '') || (!archivo && !info.recibo));
      $('admin').oninput = () => { const d = $('admin').value.replace(/\D/g, '').slice(0, 9); $('admin').value = d ? Number(d).toLocaleString('es-CO') : ''; listo(); };
      $('archivo').onchange = (ev) => elegirArchivo(ev, listo);
      $('bEnviar').onclick = () => {
        if ($('bEnviar').classList.contains('bloqueado')) return;
        const pr = progresoReal('Enviando los valores');
        llamar('enviarAjustePropietario', Object.assign({ admin: $('admin').value.replace(/\D/g, ''), prog: pr.prog }, archivo || {}))
          .then(r => pr.fin(r && r.ok).then(() => r)).then(r => {
            if (!r.ok) return mostrarError(r.mensaje || 'No pudimos enviar.');
            exito('¡Enviado!', r.mensaje || '');
          }).catch(() => { pr.fin(false); mostrarError('Error de red. Intenta de nuevo.'); });
      };
      listo();
    }
    // Las fotos grandes se achican a 1800 px en JPG
    function elegirArchivo(ev, listo) {
      const f = ev.target.files[0]; if (!f) return;
      $('err').classList.add('oculto');
      const marcar = (html) => { $('previa').innerHTML = html; $('zona').classList.add('lista'); listo(); };
      if (f.type === 'application/pdf') {
        if (f.size > 15 * 1024 * 1024) return mostrarError('El PDF pesa más de 15 MB.');
        const lector = new FileReader();
        lector.onload = () => { archivo = { base64: lector.result.split(',')[1], mimeType: 'application/pdf' }; marcar('📄 ' + esc(f.name)); };
        lector.readAsDataURL(f); return;
      }
      if (!/^image\//.test(f.type)) return mostrarError('Sube una foto o un PDF.');
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1800 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL('image/jpeg', 0.85);
        archivo = { base64: url.split(',')[1], mimeType: 'image/jpeg' };
        marcar(`<img class="previa" src="${url}" alt="Recibo">`);
      };
      img.onerror = () => mostrarError('No pudimos leer esa imagen. Prueba con otra o con un PDF.');
      img.src = URL.createObjectURL(f);
    }

    // ================= Piezas: modal, deslizador y barra de avance real (las de renovacion.html) =================
    function capa(html) {
      document.querySelectorAll('.confirmar').forEach(x => x.remove());
      const c = document.createElement('div'); c.className = 'confirmar'; c.innerHTML = `<div class="caja" role="dialog" aria-modal="true">${html}</div>`;
      document.body.appendChild(c); return c;
    }
    const deslizador = (t) => `<div class="deslizar"><div class="relleno"></div><div class="texto">${t}</div><div class="perilla">›</div></div>`;
    function activarDeslizador(c) {
      const qq = (s) => c.querySelector(s);
      const pista = qq('.deslizar'), perilla = qq('.perilla'), relleno = qq('.relleno');
      let x0 = null, max = 0;
      const mover = (x) => { const d = Math.max(0, Math.min(max, x - x0)); perilla.style.transform = `translateX(${d}px)`; relleno.style.width = (d + 28) + 'px'; return d; };
      pista.addEventListener('pointerdown', (e) => {
        if (pista.classList.contains('listo')) return;
        e.preventDefault();
        x0 = perilla.getBoundingClientRect().left + perilla.offsetWidth / 2; max = pista.clientWidth - perilla.offsetWidth - 8; pista.classList.remove('volviendo');
        try { pista.setPointerCapture(e.pointerId); } catch (_) {}
        mover(e.clientX);
      });
      pista.addEventListener('pointermove', (e) => { if (x0 !== null) mover(e.clientX); });
      const soltar = (e) => {
        if (x0 === null) return;
        const d = mover(e.clientX); x0 = null;
        if (d >= max * 0.8) {
          perilla.style.transform = `translateX(${max}px)`; relleno.style.width = '100%';
          pista.classList.add('listo'); perilla.textContent = '✓'; qq('.texto').textContent = 'Listo';
          qq('.si').classList.remove('oculto'); qq('.si').classList.add('entra');
        } else { pista.classList.add('volviendo'); perilla.style.transform = ''; relleno.style.width = '0'; }
      };
      pista.addEventListener('pointerup', soltar); pista.addEventListener('pointercancel', soltar);
      pista.addEventListener('dragstart', (e) => e.preventDefault());
    }
    function progresoReal(titulo) {
      const prog = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
      const c = capa(`<div class="icono">📈</div><h3>${esc(titulo)}…</h3><p class="pct" id="pct">0 %</p><div class="barraP"><div id="barraP"></div></div><p class="nota centro" id="etapaP">Iniciando…</p>`);
      let v = 0, meta = 3, activo = true;
      const pintarV = () => { c.querySelector('#pct').textContent = Math.round(v) + ' %'; c.querySelector('#barraP').style.width = v + '%'; };
      const t = setInterval(() => { if (v < meta) { v = Math.min(meta, v + Math.max(0.4, (meta - v) * 0.15)); pintarV(); } }, 120);
      const consultar = () => {
        if (!activo) return;
        fetch(API, { method: 'POST', body: JSON.stringify({ accion: 'progresoSala', prog: prog }) }).then(r => r.json()).then(r => {
          if (!activo || !r || !r.ok) return;
          if (r.pct > meta) meta = Math.min(r.pct, 97);
          if (r.texto) c.querySelector('#etapaP').textContent = r.texto + '…';
        }).catch(() => {}).finally(() => { if (activo) setTimeout(consultar, 1000); });
      };
      setTimeout(consultar, 600);
      return {
        prog: prog,
        fin(ok) {
          activo = false; clearInterval(t);
          if (!ok) { c.remove(); return Promise.resolve(); }
          c.querySelector('#etapaP').textContent = '¡Listo!';
          return new Promise(res => { const s = setInterval(() => { v = Math.min(100, v + 4); pintarV(); if (v >= 100) { clearInterval(s); setTimeout(() => { c.remove(); res(); }, 450); } }, 30); });
        }
      };
    }

    function cargar() {
      if (!K || !A || !ROL || !TOKEN) return error('El enlace está incompleto.');
      llamar('infoAjusteAnual').then(r => {
        if (!r || !r.ok) return error((r && r.mensaje) || 'No pudimos abrir esta página.');
        info = r;
        $('cargando').classList.add('oculto'); $('contenido').classList.remove('oculto');
        $('inmueble').textContent = '📍 ' + info.direccion;
        if (info.rol === 'AGENTE') vistaAgente(); else vistaPropietario();
      }).catch(() => error('Revisa tu conexión a internet e intenta de nuevo.'));
    }
    cargar();
  </script>
