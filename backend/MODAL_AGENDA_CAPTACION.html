<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --oro: #b8962e; --oro-suave: #f7f1de; --tinta: #1c1917; --suave: #78716c; --linea: #e7e5e4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--tinta); background: #fff; }
    html, body { height: 100%; }
    body { padding: 0; background: #faf9f7; }
    .cabeza { background: linear-gradient(135deg, #0c0a09 0%, #1c1917 60%, #2a2316 100%); padding: 16px 22px 14px; border-bottom: 2px solid #d4af37; position: relative; }
    .cabeza::after { content: ''; position: absolute; left: 22px; right: 22px; bottom: -6px; height: 1px; background: linear-gradient(90deg, transparent, rgba(212,175,55,.5), transparent); }
    .marca { font-size: 11px; letter-spacing: 3.5px; font-weight: 700; color: #d4af37; }
    .marca span { color: #d6d3d1; font-weight: 400; }
    .sub { font-size: 12.5px; color: #a8a29e; margin: 3px 0 0; }
    .cuerpo { padding: 18px 22px 96px; }
    .vista, #v0 { background: #fff; border: 1px solid rgba(212,175,55,.35); border-radius: 18px; padding: 18px 18px 6px; box-shadow: 0 10px 30px rgba(28,25,23,.06); }

    .pasos { display: flex; gap: 6px; margin-bottom: 14px; }
    .paso { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--linea); font-size: 12.5px; color: var(--suave); background: #fff; transition: all .3s ease; cursor: default; }
    .paso i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; background: #f5f5f4; color: var(--suave); transition: all .3s ease; flex: 0 0 22px; }
    .paso.activo { border-color: #d4af37; color: var(--tinta); font-weight: 600; box-shadow: 0 0 0 3px rgba(212,175,55,.12); }
    .paso.activo i { background: #0c0a09; color: #d4af37; }
    .paso.hecho { cursor: pointer; color: var(--tinta); }
    .paso.hecho i { background: var(--oro); color: #fff; }

    .vista { display: none; animation: entrar .35s ease; }
    .vista.activa { display: block; }
    @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .grupo { margin-bottom: 12px; }
    label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 600; margin-bottom: 5px; }
    input, select, textarea { width: 100%; border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; background: #fff; }
    input:focus, select:focus, textarea:focus { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184,150,46,.15); }
    textarea { resize: vertical; min-height: 70px; }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ayuda { font-size: 11.5px; color: var(--suave); margin-top: 4px; }

    .dias { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    .dia { flex: 0 0 58px; border: 1px solid var(--linea); border-radius: 12px; background: #fff; padding: 7px 0; text-align: center; cursor: pointer; transition: all .2s; font: inherit; }
    .dia b { display: block; font-size: 17px; }
    .dia span { font-size: 10.5px; color: var(--suave); text-transform: uppercase; letter-spacing: .05em; }
    .dia:hover { border-color: var(--oro); }
    .dia.activo { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    .dia.activo span { color: #d6d3d1; }
    .horas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; min-height: 40px; }
    .hora { border: 1px solid var(--linea); border-radius: 10px; background: #fff; padding: 9px 0; font: inherit; font-size: 13px; cursor: pointer; transition: all .2s; }
    .hora:hover { border-color: var(--oro); }
    .hora.activo { background: var(--oro); border-color: var(--oro); color: #fff; font-weight: 600; }
    .nota { font-size: 12.5px; color: var(--suave); grid-column: 1 / -1; padding: 8px 0; }

    .resumen { background: var(--tinta); color: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
    .resumen .et { color: #d4af37; font-size: 11px; letter-spacing: 2px; font-weight: 700; }
    .resumen .cuando { font-size: 19px; font-weight: 700; margin-top: 4px; }
    .resumen .linea { font-size: 13.5px; color: #d6d3d1; margin-top: 4px; }

    .pie { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 22px; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border-top: 1px solid rgba(212,175,55,.45); box-shadow: 0 -8px 24px rgba(28,25,23,.06); z-index: 5; }
    .vista:not(.activa) .pie { display: none; }
    button.btn { border: 0; border-radius: 999px; padding: 10px 22px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s, transform .2s; }
    .btn.sec { background: #fff; color: var(--tinta); border: 1px solid #d6d3d1; }
    .btn.sec:hover { border-color: var(--tinta); }
    .btn.pri { background: #0c0a09; color: #f5e7b8; border: 1px solid #d4af37; box-shadow: 0 6px 16px rgba(12,10,9,.25), inset 0 0 0 1px rgba(212,175,55,.15); letter-spacing: .02em; }
    .btn.pri:not(:disabled):hover { background: #1c1917; color: #fff; }
    .btn.pri:disabled { opacity: .35; cursor: default; }
    .btn.pri:not(:disabled):hover { transform: translateY(-1px); }
    .error { color: #b91c1c; font-size: 13px; margin-top: 10px; min-height: 18px; }
    .listo { text-align: center; padding: 40px 22px; }
    .listo .ok { width: 54px; height: 54px; border-radius: 50%; background: var(--oro-suave); color: var(--oro); font-size: 26px; display: grid; place-items: center; margin: 0 auto 14px; }
    .listo h2 { margin: 0 0 6px; font-size: 19px; }
    .listo p { color: var(--suave); font-size: 14px; margin: 0 0 20px; }
    .oculto { display: none; }
    .titInicio { font-size: 18px; margin: 4px 0 14px; }
    .inicio { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grande { text-align: left; border: 1px solid var(--linea); border-radius: 16px; background: #fff; padding: 18px 16px; cursor: pointer; font: inherit; transition: all .3s ease; }
    .grande:hover { border-color: var(--oro); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(28,25,23,.08); }
    .grande i { font-style: normal; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--oro-suave); font-size: 20px; margin-bottom: 12px; }
    .grande b { display: block; font-size: 15px; }
    .grande span { display: block; font-size: 12.5px; color: var(--suave); margin-top: 4px; line-height: 1.4; }
    .etModo { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 10px; border-radius: 999px; background: var(--oro-suave); color: var(--oro); margin-bottom: 12px; cursor: pointer; }
    .modo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opc { border: 1px solid var(--linea); border-radius: 12px; background: #fff; padding: 9px 12px; text-align: left; cursor: pointer; font: inherit; transition: all .25s; }
    .opc b { display: block; font-size: 14px; }
    .opc span { font-size: 11.5px; color: var(--suave); }
    .opc.activo { background: var(--tinta); border-color: var(--tinta); color: #fff; }
    .opc.activo span { color: #d6d3d1; }
    .cuenta { position: relative; width: 64px; height: 64px; margin: 0 auto 10px; }
    .cuenta svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .cuenta circle { fill: none; stroke-width: 4; }
    .cuenta .fondo { stroke: var(--linea); }
    .cuenta .anillo { stroke: var(--oro); stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
    .cuenta b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: var(--tinta); }
    .cuenta b.late { animation: latir .5s ease; }
    @keyframes latir { 0% { transform: scale(1.25); opacity: .6; } 100% { transform: scale(1); opacity: 1; } }
    .cierra { font-size: 12px; color: var(--suave); margin-bottom: 14px; }
    .pac-container { z-index: 99999; border-radius: 10px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="cabeza">
    <div class="marca">GOLD LIFE <span>REAL ESTATE</span></div>
    <div class="sub">Presentación de servicios al propietario · los datos vienen del registro</div>
  </div>
  <div id="form" class="cuerpo">

    <!-- Pantalla inicial: tipo de presentación -->
    <div id="v0" class="vista activa">
      <h2 class="titInicio">¿Cómo será la presentación?</h2>
      <div class="inicio">
        <button type="button" class="grande" data-m="PRESENCIAL">
          <i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#b8962e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg></i><b>Captación presencial</b><span>Visitas y evalúas el inmueble en persona.</span>
        </button>
        <button type="button" class="grande" data-m="VIRTUAL">
          <i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#b8962e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg></i><b>Presentación virtual</b><span>Por Google Meet: el link llega en el correo.</span>
        </button>
      </div>
      <div class="pie"><button class="btn sec" onclick="google.script.host.close()">Cerrar</button><span></span></div>
    </div>

    <div class="pasos oculto" id="pasos">
      <div class="paso activo" data-p="1"><i>1</i>Datos</div>
      <div class="paso" data-p="2"><i>2</i>Día y hora</div>
      <div class="paso" data-p="3"><i>3</i>Confirmar</div>
    </div>

    <!-- Paso 1: datos -->
    <div class="vista" id="v1">
      <span class="etModo" id="etModo"></span>
      <div class="dos">
        <div class="grupo"><label>Nombre</label><input id="nombre"></div>
        <div class="grupo"><label>Celular</label><input id="celular" inputmode="numeric"></div>
      </div>
      <div class="grupo"><label>Correo del propietario</label><input id="correo" type="email" placeholder="Pídelo en la llamada o por WhatsApp"></div>
      <div class="grupo"><label>Servicio</label>
        <select id="servicio">
          <option value="Venta">Venta (Corretaje)</option>
          <option value="Arriendo">Arriendo (Corretaje)</option>
          <option value="Administración">Administración Integral</option>
          <option value="Vendi-Renta">Vendi-Renta</option>
          <option value="Admi-Venta">Admi-Venta</option>
        </select>
      </div>
      <div class="grupo"><label>Dirección del inmueble</label>
        <input id="direccion" autocomplete="off" placeholder="Escribe la dirección y elige una sugerencia">
        <div class="ayuda" id="ayudaDir">Del registro: <span id="dirRegistro"></span></div>
      </div>
      <div class="pie"><button class="btn sec" onclick="google.script.host.close()">Cerrar</button>
        <button class="btn pri" id="sig1" onclick="ir(2)">Siguiente</button></div>
    </div>

    <!-- Paso 2: día y hora -->
    <div class="vista" id="v2">
      <div class="grupo"><label>Día</label><div class="dias" id="dias"></div></div>
      <div class="grupo"><label>Hora</label><div class="horas" id="horas"><div class="nota">Elige un día.</div></div></div>
      <div class="pie"><button class="btn sec" onclick="ir(1)">Atrás</button>
        <button class="btn pri" id="sig2" disabled onclick="ir(3)">Siguiente</button></div>
    </div>

    <!-- Paso 3: confirmar -->
    <div class="vista" id="v3">
      <div class="resumen">
        <div class="et" id="rEt">PRESENTACIÓN AL PROPIETARIO</div>
        <div class="cuando" id="rCuando"></div>
        <div class="linea" id="rQuien"></div>
        <div class="linea" id="rDonde"></div>
      </div>
      <div class="grupo"><label>Notas para la cita</label><textarea id="notas"></textarea></div>
      <div class="error" id="error"></div>
      <div class="pie"><button class="btn sec" onclick="ir(2)">Atrás</button>
        <button class="btn pri" id="agendar" onclick="agendar()">Agendar cita</button></div>
    </div>
  </div>

  <div id="listo" class="listo oculto">
    <div class="ok">✓</div>
    <h2>Cita agendada</h2>
    <p id="resumenFinal"></p>
    <div class="cuenta"><svg viewBox="0 0 64 64"><circle class="fondo" cx="32" cy="32" r="28"/><circle class="anillo" id="anillo" cx="32" cy="32" r="28"/></svg><b id="num">5</b></div>
    <div class="cierra">Esta ventana se cierra sola</div>
    <button class="btn pri" onclick="google.script.host.close()">Cerrar ahora</button>
  </div>

  <script>
    const D = <?!= DATOS ?>;
    const $ = (id) => document.getElementById(id);
    const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
    const DIAS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
    const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    let slot = null, diaSel = null, consulta = 0, pasoMax = 1, modalidad = 'PRESENCIAL';
    document.querySelectorAll('.grande').forEach(b => b.onclick = () => {
      modalidad = b.dataset.m;
      $('etModo').textContent = (modalidad === 'VIRTUAL' ? 'PRESENTACIÓN VIRTUAL · MEET' : 'CAPTACIÓN PRESENCIAL') + '  ·  cambiar';
      $('rEt').textContent = modalidad === 'VIRTUAL' ? 'PRESENTACIÓN VIRTUAL · GOOGLE MEET' : 'CAPTACIÓN PRESENCIAL';
      $('v0').classList.remove('activa'); $('pasos').classList.remove('oculto'); ir(1);
    });
    $('etModo').onclick = () => { [1, 2, 3].forEach(k => $('v' + k).classList.remove('activa')); $('pasos').classList.add('oculto'); $('v0').classList.add('activa'); };

    $('nombre').value = D.nombre; $('celular').value = D.celular; $('correo').value = D.correo;
    $('servicio').value = D.servicio; $('direccion').value = D.direccion; $('notas').value = D.notas;
    $('dirRegistro').textContent = D.direccion || 'sin ubicación';

    // ---------- Pasos ----------
    const correoOk = () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('correo').value.trim());
    const paso1Ok = () => $('nombre').value.trim() && $('celular').value.trim() && correoOk();
    function revisar() { $('sig1').disabled = !paso1Ok(); $('sig2').disabled = !slot; }
    ['nombre', 'celular', 'correo'].forEach(id => $(id).addEventListener('input', revisar));
    revisar();

    function ir(n) {
      if (n >= 2 && !paso1Ok()) return;
      if (n >= 3 && !slot) return;
      pasoMax = Math.max(pasoMax, n);
      [1, 2, 3].forEach(k => $('v' + k).classList.toggle('activa', k === n));
      document.querySelectorAll('.paso').forEach(p => {
        const k = Number(p.dataset.p);
        p.classList.toggle('activo', k === n);
        p.classList.toggle('hecho', k !== n && k <= pasoMax && (k === 1 ? paso1Ok() : k === 2 ? !!slot : false));
      });
      if (n === 3) {
        const t = DIAS_L[diaSel.getDay()] + ' ' + diaSel.getDate() + ' de ' + MESES[diaSel.getMonth()] + ' · ' + slot.horaAmPm;
        $('rCuando').textContent = t.charAt(0).toUpperCase() + t.slice(1);
        $('rQuien').textContent = $('nombre').value.trim() + ' · ' + $('servicio').value + (modalidad === 'VIRTUAL' ? ' · Virtual (Google Meet)' : ' · Presencial');
        $('rDonde').textContent = $('direccion').value.trim();
      }
    }
    document.querySelectorAll('.paso').forEach(p => p.onclick = () => { if (p.classList.contains('hecho')) ir(Number(p.dataset.p)); });

    // ---------- Días y horas ----------
    const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const hoy = new Date();
    for (let i = 0; i < 21; i++) {
      const d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + i);
      const b = document.createElement('button');
      b.className = 'dia'; b.innerHTML = '<span>' + DIAS[d.getDay()] + '</span><b>' + d.getDate() + '</b><span>' + MESES[d.getMonth()].slice(0, 3) + '</span>';
      b.onclick = () => elegirDia(d, b);
      $('dias').appendChild(b);
    }
    function elegirDia(d, b) {
      document.querySelectorAll('.dia').forEach(x => x.classList.remove('activo')); b.classList.add('activo');
      diaSel = d; slot = null; revisar();
      $('horas').innerHTML = '<div class="nota">Buscando horarios…</div>';
      const n = ++consulta;
      google.script.run.withSuccessHandler(r => {
        if (n !== consulta) return;
        if (!r || !r.success) { $('horas').innerHTML = '<div class="nota">No se pudo consultar la agenda.</div>'; return; }
        if (!r.libre || !r.slots.length) { $('horas').innerHTML = '<div class="nota">' + (r.motivo || 'Sin horarios libres este día.') + '</div>'; return; }
        $('horas').innerHTML = '';
        r.slots.forEach(s => {
          const h = document.createElement('button'); h.className = 'hora'; h.textContent = s.horaAmPm;
          h.onclick = () => { document.querySelectorAll('.hora').forEach(x => x.classList.remove('activo')); h.classList.add('activo'); slot = s; revisar(); };
          $('horas').appendChild(h);
        });
      }).withFailureHandler(() => { if (n === consulta) $('horas').innerHTML = '<div class="nota">No se pudo consultar la agenda.</div>'; })
        .disponibilidadCaptacion(iso(d) + 'T08:00:00');
    }

    // Tras agendar: burbuja que cuenta de 5 a 0 y cierra la ventana
    function cuentaRegresiva() {
      let n = 5; const total = 176;
      const pintar = () => { $('num').textContent = n; $('num').classList.remove('late'); void $('num').offsetWidth; $('num').classList.add('late'); $('anillo').style.strokeDashoffset = total * (1 - n / 5); };
      pintar();
      const t = setInterval(() => { n--; pintar(); if (n <= 0) { clearInterval(t); setTimeout(() => google.script.host.close(), 600); } }, 1000);
    }

    // ---------- Agendar ----------
    function agendar() {
      const txt = $('rCuando').textContent;
      $('agendar').disabled = true; $('agendar').textContent = 'Agendando…'; $('error').textContent = '';
      google.script.run.withSuccessHandler(r => {
        if (r && r.success) {
          $('form').classList.add('oculto'); $('listo').classList.remove('oculto');
          $('resumenFinal').textContent = txt + '. Le llegó el correo a ' + $('correo').value.trim() + ' y quedó en tu calendario.';
          cuentaRegresiva();
        } else { $('error').textContent = (r && (r.error || r.message)) || 'No se pudo agendar.'; $('agendar').textContent = 'Agendar cita'; $('agendar').disabled = false; }
      }).withFailureHandler(e => { $('error').textContent = e.message; $('agendar').textContent = 'Agendar cita'; $('agendar').disabled = false; })
        .agendarDesdeCaptacion({ hoja: D.hoja, fila: D.fila, nombre: $('nombre').value.trim(), celular: $('celular').value.trim(),
          correo: $('correo').value.trim(), servicio: $('servicio').value, direccion: $('direccion').value.trim(), notas: $('notas').value.trim(),
          timestamp: slot.timestamp, textoCita: txt, modalidad: modalidad });
    }

    // ---------- Buscador de direcciones (el mismo del formulario de registro) ----------
    // Dirección corta normalizada a partir de lo que devuelve Google Places.
// Extraído tal cual de PortfolioLocationStep.tsx (5-nov-2026) para usarlo también en la
// agenda del propietario. Las reglas de abajo NO se cambian sin revisar la directiva.
function direccionCortaColombia(googleStreet, googleNumber, formattedAddress) {
  // Normalización básica de la dirección corta
  let shortAddress = "";
  if (googleStreet && googleNumber) {
    shortAddress = `${googleStreet} #${googleNumber}`;
  } else if (googleStreet) {
    shortAddress = googleStreet;
  } else {
    shortAddress = formattedAddress.split(',')[0].trim();
  }

  // ============================================================================
  // 🚨 DIRECTIVA CRÍTICA DE NORMALIZACIÓN LEGAL COLOMBIANA 🚨
  // Toda modificación a este bloque debe respetar ESTRICTAMENTE las reglas de:
  // 1. IGAC (Instituto Geográfico Agustín Codazzi) y Catastros Locales.
  // 2. DANE (Departamento Administrativo Nacional de Estadística).
  // 3. SNR (Superintendencia de Notariado y Registro).
  // 4. Operadores postales oficiales (4-72) y DIAN.
  //
  // REGLAS ABSOLUTAS PARA CONTRATOS Y FOLIOS DE MATRÍCULA:
  // - Las abreviaturas deben ser las estandarizadas (ej. Cra, Cl, Av, AK, AC).
  // - Las letras asociadas a las vías/placas (A, B, C) DEBEN IR EN MAYÚSCULAS 
  //   para evitar ambigüedades jurídicas y notariales.
  // - Palabras clave como 'BIS', 'SUR', 'ESTE' DEBEN IR EN MAYÚSCULAS CERRADAS.
  // - El símbolo universal a usar es el numeral (#) y no "No.", "Nro.", etc.
  // - Las letras y sufijos van pegados a su respectivo número (Ej: 134B, no 134 B).
  // - No deben existir espacios rodeando el guion separador (Ej: #134B-18).
  // ============================================================================
  
  // Normalizar abreviaturas comunes (Estándar Catastral para Servicios Públicos)
  shortAddress = shortAddress
    .replace(/Avenida Carrera/gi, 'AK')
    .replace(/Avenida Calle/gi, 'AC')
    .replace(/Avenida/gi, 'Av')
    .replace(/Carrera/gi, 'Cra')
    .replace(/Calle/gi, 'Cl')
    .replace(/Transversal/gi, 'Tv')
    .replace(/Diagonal/gi, 'Dg')
    .replace(/Autopista/gi, 'Aut');

  // Limpieza estricta de numerales y espacios (Ej. "AK 9 ## 185-61" -> "AK 9 #185-61")
  // ⚠️ EL ORDEN IMPORTA: primero se convierten "No", "Nro", "N°" en "#" y SOLO
  // DESPUÉS se colapsan los numerales dobles. Al revés, "Cl 143 # No 9-55"
  // quedaba "Cl 143 ##9-55" (pasó el 18-09-2026 y llegó así al contrato).
  shortAddress = shortAddress
    .replace(/\./g, '')              // Eliminar puntos (Cl. -> Cl)
    .replace(/\bN[°º]\s*/gi, '#')    // N° / Nº -> #
    .replace(/\bNro\b\s*/gi, '#')    // Nro -> #
    .replace(/\bNo\b\s*/gi, '#')     // No -> # (palabra suelta: no toca "Norte")
    .replace(/#(\s*#)+/g, '#')       // Colapsar numerales repetidos (##, # #)
    .replace(/#\s+/g, '#')           // Sin espacio DESPUÉS del numeral
    .replace(/\s*#/g, ' #')          // Un solo espacio ANTES del numeral
    .replace(/\s{2,}/g, ' ')         // Espacios dobles
    .trim();

  // Obligar a MAYÚSCULAS las letras anexas a números y palabras clave
  shortAddress = shortAddress
    .replace(/\b([a-z])\b/g, (match) => match.toUpperCase()) // Letras sueltas a mayúscula (a -> A)
    .replace(/(\d)\s+([a-zA-Z])\b/g, '$1$2') // Pegar letra al número (10 A -> 10A)
    .replace(/\bbis\b/gi, 'BIS')
    .replace(/\bsur\b/gi, 'SUR')
    .replace(/\beste\b/gi, 'ESTE')
    .replace(/(\d)([a-z])/g, (m, p1, p2) => `${p1}${p2.toUpperCase()}`); // (10a -> 10A)

  // Heurística de Placa Colombiana (Distancia en metros):
  // Si Google Maps arroja la placa todo junto (Ej. #1712), en Colombia los últimos 
  // 2 dígitos suelen ser la distancia (17-12). Se inyecta el guion automáticamente.
  if (shortAddress.includes('#')) {
    const parts = shortAddress.split('#');
    let placa = parts[1].trim();
    // Solo actuar si NO tiene guion y tiene longitud para dividirse
    if (!placa.includes('-') && placa.length >= 3) {
      const lastTwo = placa.slice(-2);
      const rest = placa.slice(0, -2).replace(/\s/g, ''); // Limpiar espacios internos
      if (/^\d{2}$/.test(lastTwo)) {
        shortAddress = `${parts[0].trim()} #${rest}-${lastTwo}`;
      }
    }
  }

  // Asegurar que no haya espacios alrededor del guion (Ej. "134B - 18" -> "134B-18")
  shortAddress = shortAddress.replace(/\s*-\s*/g, '-');
  return shortAddress;
}

/** Componentes que se usan de un lugar de Google Places. */
function componentesLugar(components) {
  let calle = '', numero = '', barrio = '', localidad = '', ciudad = '', departamento = '';
  (components || []).forEach((comp) => {
    const types = comp.types;
    if (types.includes('route')) calle = comp.long_name;
    if (types.includes('street_number')) numero = comp.long_name;
    if (types.includes('neighborhood') || types.includes('sublocality_level_2')) barrio = comp.long_name;
    if (types.includes('sublocality_level_1') || types.includes('sublocality')) localidad = comp.long_name;
    if (types.includes('locality')) ciudad = comp.long_name;
    if (types.includes('administrative_area_level_1')) departamento = comp.long_name;
  });
  return { calle, numero, barrio, localidad, ciudad, departamento };
}
    window.iniciarBuscador = function () {
      try {
        const ac = new google.maps.places.Autocomplete($('direccion'), { componentRestrictions: { country: 'co' }, fields: ['address_components', 'formatted_address'] });
        ac.addListener('place_changed', () => {
          const lugar = ac.getPlace();
          if (!lugar || !lugar.address_components) return;
          const c = componentesLugar(lugar.address_components);
          const corta = direccionCortaColombia(c.calle, c.numero, lugar.formatted_address || '');
          $('direccion').value = [corta, c.barrio || c.localidad, c.ciudad].filter((x, i, a) => x && a.indexOf(x) === i).join(', ');
        });
      } catch (e) { /* sin buscador: el campo sigue siendo de texto libre */ }
    };
    const s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=AIzaSyDppOCGMciDpRHVAH4nuBIdKaDlu7zgy_E&libraries=places&callback=iniciarBuscador';
    s.async = true; document.head.appendChild(s);
  </script>
