<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      html, body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 14px 16px;
        color: #1e293b;
        box-sizing: border-box;
        height: 100%;
        overflow: hidden;
      }
      *, *:before, *:after { box-sizing: inherit; }

      .cabecera { flex: 0 0 auto; }
      .modal-title {
        font-size: 15px; font-weight: 700; color: #0f172a;
        display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
      }
      .modal-subtitle { font-size: 12px; color: #64748b; margin-bottom: 12px; }

      .marco { display: flex; flex-direction: column; height: 100%; }

      .totales {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 6px; margin-bottom: 12px;
      }
      .total-caja {
        border: 1.5px solid #e2e8f0; border-radius: 8px;
        background: #f8fafc; padding: 8px 6px; text-align: center;
      }
      .total-num { font-size: 17px; font-weight: 700; color: #0f172a; line-height: 1.1; }
      .total-lbl { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: .3px; }

      .lista { flex: 1 1 auto; overflow-y: auto; padding-right: 4px; }
      .lista::-webkit-scrollbar { width: 8px; }
      .lista::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

      .tarjeta {
        border: 1.5px solid #e2e8f0; border-radius: 10px;
        padding: 10px 12px; margin-bottom: 8px; background: #fff;
      }
      .tarjeta:hover { border-color: #cbd5e1; }
      .tarjeta-top {
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 6px;
      }
      .fecha { font-size: 13px; font-weight: 700; color: #0f172a; }
      .chip-total {
        font-size: 11px; font-weight: 700; color: #1d4ed8;
        background: #eff6ff; border: 1px solid #bfdbfe;
        border-radius: 999px; padding: 2px 9px;
      }
      .chip-total.cero { color: #94a3b8; background: #f8fafc; border-color: #e2e8f0; }

      .desglose { display: flex; gap: 12px; font-size: 11px; color: #475569; margin-bottom: 6px; }
      .desglose b { color: #0f172a; }

      .corrida {
        display: flex; align-items: center; gap: 7px;
        font-size: 11px; color: #64748b;
        padding: 4px 0; border-top: 1px dashed #e2e8f0;
      }
      .corrida a { color: #2563eb; text-decoration: none; margin-left: auto; }
      .corrida a:hover { text-decoration: underline; }
      .punto { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
      .ok { background: #22c55e; }  .mal { background: #ef4444; }
      .curso { background: #f59e0b; } .otro { background: #94a3b8; }
      .etiqueta-manual {
        font-size: 9px; text-transform: uppercase; letter-spacing: .3px;
        background: #f1f5f9; color: #64748b; border-radius: 4px; padding: 1px 5px;
      }

      .aviso {
        font-size: 11px; color: #92400e; background: #fffbeb;
        border: 1px solid #fde68a; border-radius: 8px;
        padding: 7px 9px; margin-bottom: 10px;
      }
      .cargando, .vacio { text-align: center; color: #94a3b8; font-size: 12px; padding: 28px 0; }
    </style>
  </head>
  <body>
    <div class="marco">
      <div class="cabecera">
        <div class="modal-title">Resumen de Captaciones</div>
        <div class="modal-subtitle">Últimas corridas del Agente Captador, agrupadas por día</div>
        <div id="avisos"></div>
        <div class="totales" id="totales" style="display:none">
          <div class="total-caja"><div class="total-num" id="t-total">0</div><div class="total-lbl">Captados</div></div>
          <div class="total-caja"><div class="total-num" id="t-arr">0</div><div class="total-lbl">Arriendo</div></div>
          <div class="total-caja"><div class="total-num" id="t-ven">0</div><div class="total-lbl">Venta</div></div>
        </div>
      </div>

      <div class="lista" id="lista">
        <div class="cargando">Consultando corridas y captaciones...</div>
      </div>
    </div>

    <script>
      function claseEstado(e) {
        if (e === 'success') return 'ok';
        if (e === 'failure' || e === 'cancelled' || e === 'timed_out') return 'mal';
        if (e === 'in_progress' || e === 'queued' || e === 'requested') return 'curso';
        return 'otro';
      }

      function textoEstado(e) {
        var mapa = {
          success: 'Exitosa', failure: 'Falló', cancelled: 'Cancelada',
          timed_out: 'Se agotó el tiempo', in_progress: 'En curso',
          queued: 'En cola', requested: 'Solicitada', skipped: 'Omitida'
        };
        return mapa[e] || e;
      }

      function crear(tag, clase, texto) {
        var el = document.createElement(tag);
        if (clase) el.className = clase;
        if (texto !== undefined) el.textContent = texto;
        return el;
      }

      function pintar(datos) {
        var lista = document.getElementById('lista');
        lista.innerHTML = '';

        if (datos.avisoGithub) {
          var av = crear('div', 'aviso', datos.avisoGithub);
          document.getElementById('avisos').appendChild(av);
        }

        var arr = 0, ven = 0;
        datos.dias.forEach(function (d) { arr += d.arriendo; ven += d.venta; });
        document.getElementById('t-total').textContent = datos.totalCaptaciones;
        document.getElementById('t-arr').textContent = arr;
        document.getElementById('t-ven').textContent = ven;
        document.getElementById('totales').style.display = 'grid';

        if (!datos.dias.length) {
          lista.appendChild(crear('div', 'vacio', 'Todavía no hay captaciones registradas.'));
          return;
        }

        datos.dias.forEach(function (d) {
          var card = crear('div', 'tarjeta');

          var top = crear('div', 'tarjeta-top');
          top.appendChild(crear('div', 'fecha', d.etiqueta));
          var chip = crear('div', 'chip-total' + (d.total ? '' : ' cero'),
                           d.total + (d.total === 1 ? ' captado' : ' captados'));
          top.appendChild(chip);
          card.appendChild(top);

          var des = crear('div', 'desglose');
          var a = crear('span'); a.innerHTML = 'Arriendo: <b>' + d.arriendo + '</b>';
          var v = crear('span'); v.innerHTML = 'Venta: <b>' + d.venta + '</b>';
          des.appendChild(a); des.appendChild(v);
          card.appendChild(des);

          d.corridas.forEach(function (c) {
            var fila = crear('div', 'corrida');
            fila.appendChild(crear('span', 'punto ' + claseEstado(c.estado)));
            fila.appendChild(crear('span', null, c.hora + '  ·  ' + textoEstado(c.estado) +
                                   (c.duracion ? '  ·  ' + c.duracion : '')));
            if (c.manual) fila.appendChild(crear('span', 'etiqueta-manual', 'manual'));
            if (c.enlace) {
              var link = crear('a', null, 'ver log');
              link.href = c.enlace;
              link.target = '_blank';
              fila.appendChild(link);
            }
            card.appendChild(fila);
          });

          lista.appendChild(card);
        });
      }

      function fallo(err) {
        var lista = document.getElementById('lista');
        lista.innerHTML = '';
        lista.appendChild(crear('div', 'vacio', 'No se pudo cargar el resumen: ' + err.message));
      }

      google.script.run.withSuccessHandler(pintar).withFailureHandler(fallo).obtenerResumenCaptaciones();
    </script>
  </body>
</html>
