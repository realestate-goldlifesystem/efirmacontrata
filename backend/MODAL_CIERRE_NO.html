<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root { --oro: #b8962e; --oro-suave: #f7f1de; --tinta: #1c1917; --suave: #78716c; --linea: #e7e5e4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--tinta); background: #faf9f7; }
    .cabeza { background: linear-gradient(135deg, #0c0a09 0%, #1c1917 60%, #2a2316 100%); padding: 16px 22px 14px; border-bottom: 2px solid #d4af37; }
    .marca { font-size: 11px; letter-spacing: 3.5px; font-weight: 700; color: #d4af37; }
    .marca span { color: #d6d3d1; font-weight: 400; }
    .sub { font-size: 12.5px; color: #a8a29e; margin: 3px 0 0; }
    .cuerpo { padding: 18px 22px 90px; }
    .tarjeta { background: #fff; border: 1px solid rgba(212,175,55,.35); border-radius: 18px; padding: 16px 18px 10px; box-shadow: 0 10px 30px rgba(28,25,23,.06); animation: entrar .35s ease; }
    @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .quien { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
    .quien b { font-size: 16px; }
    .quien span { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--oro-suave); color: var(--oro); }
    label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); font-weight: 600; margin-bottom: 6px; }
    .razones { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .razon { border: 1px solid var(--linea); border-radius: 999px; background: #fff; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; transition: all .2s; }
    .razon:hover { border-color: var(--oro); }
    .razon.activo { background: #0c0a09; border-color: #d4af37; color: #fff; }
    textarea { width: 100%; min-height: 80px; border: 1px solid var(--linea); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; outline: none; resize: vertical; transition: border-color .2s, box-shadow .2s; }
    textarea:focus { border-color: var(--oro); box-shadow: 0 0 0 3px rgba(184,150,46,.15); }
    .nota { font-size: 12px; color: var(--suave); margin: 8px 0 4px; }
    .error { color: #b91c1c; font-size: 13px; min-height: 18px; margin-top: 6px; }
    .pie { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 12px 22px; background: rgba(255,255,255,.96); border-top: 1px solid rgba(212,175,55,.45); }
    .btn { border-radius: 10px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn.sec { background: #fff; color: var(--tinta); border: 1px solid #d6d3d1; }
    .btn.pri { background: #0c0a09; color: #f5e7b8; border: 1px solid #d4af37; }
    .btn.pri:disabled { opacity: .35; cursor: default; }
    .listo { text-align: center; padding: 50px 22px; font-size: 15px; }
    .oculto { display: none; }
  </style>
</head>
<body>
  <div class="cabeza">
    <div class="marca">GOLD LIFE <span>REAL ESTATE</span></div>
    <div class="sub">Cierre del lead · queda como última anotación</div>
  </div>
  <div class="cuerpo" id="form">
    <div class="tarjeta">
      <div class="quien"><b id="nombre"></b><span id="lead"></span></div>
      <label>¿Por qué queda en NO?</label>
      <div class="razones" id="razones"></div>
      <label>Detalle (opcional)</label>
      <textarea id="detalle" maxlength="400" placeholder="Ej. Lo arrendó directo con un conocido; volver a contactar en junio"></textarea>
      <div class="nota">Si tenía una llamada o mensaje de seguimiento programado, se cancela (queda ❌ en el calendario como historial).</div>
      <div class="error" id="error"></div>
    </div>
  </div>
  <div class="listo oculto" id="listo">🔒 Lead cerrado en NO. La razón quedó en el seguimiento.</div>
  <div class="pie" id="pie">
    <button class="btn sec" onclick="google.script.host.close()">Sin razón por ahora</button>
    <button class="btn pri" id="guardar" disabled>Cerrar en NO</button>
  </div>
  <script>
    const D = <?!= DATOS ?>;
    const $ = (id) => document.getElementById(id);
    $('nombre').textContent = D.nombre || 'Propietario';
    $('lead').textContent = D.idLead || '';
    let razon = '';
    $('razones').innerHTML = D.razones.map(r => '<button type="button" class="razon">' + r + '</button>').join('');
    document.querySelectorAll('.razon').forEach(b => b.onclick = () => {
      document.querySelectorAll('.razon').forEach(x => x.classList.remove('activo'));
      b.classList.add('activo'); razon = b.textContent; revisar();
    });
    $('detalle').addEventListener('input', revisar);
    function revisar() { $('guardar').disabled = !razon || (razon === 'Otra razón' && !$('detalle').value.trim()); }
    $('guardar').onclick = () => {
      $('guardar').disabled = true; $('guardar').textContent = 'Guardando…'; $('error').textContent = '';
      google.script.run.withSuccessHandler(r => {
        if (r && r.success) {
          $('form').classList.add('oculto'); $('pie').classList.add('oculto'); $('listo').classList.remove('oculto');
          setTimeout(() => google.script.host.close(), 2500);
        } else { $('error').textContent = (r && r.error) || 'No se pudo guardar.'; $('guardar').textContent = 'Cerrar en NO'; revisar(); }
      }).withFailureHandler(e => { $('error').textContent = e.message; $('guardar').textContent = 'Cerrar en NO'; revisar(); })
        .cerrarLeadEnNo({ hoja: D.hoja, fila: D.fila, razon: razon, detalle: $('detalle').value });
    };
  </script>
</body>
</html>
