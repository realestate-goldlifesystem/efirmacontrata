<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      /* El padding va SOLO en body: cuando estaba en la regla 'html, body' se
         aplicaba dos veces (16px de html + 16px de body por lado), y el
         contenido quedaba 64px más angosto y 28px más abajo de lo previsto
         -- ese era el espacio muerto a la derecha y abajo del modal. */
      html {
        margin: 0;
        padding: 0;
        /* Antes era 'hidden', y al crecer el contenido (selector de sector y
           resumen del plan) el modal recortaba los botones sin aviso.
           Con 'auto' aparece scroll en vez de perderse contenido. */
        overflow-x: hidden;
        overflow-y: auto;
      }
      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-color: #ffffff;
        margin: 0;
        padding: 14px 16px;
        color: #1e293b;
        box-sizing: border-box;
      }
      *, *:before, *:after {
        box-sizing: inherit;
      }
      .modal-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 2px;
        color: #0f172a;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .modal-subtitle {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 12px;
      }
      /* Titulo de seccion y su atajo "Todos" en la misma linea: antes el
         atajo de habitaciones era un boton de ancho completo con su propia
         fila, y entre eso y los margenes el modal sobraba alto por debajo. */
      .seccion-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .seccion-label {
        font-size: 11px; font-weight: 700; color: #334155;
        text-transform: uppercase; letter-spacing: .3px;
      }
      .chip-todos {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .3px;
        padding: 3px 10px;
        border: 1.5px solid #e2e8f0;
        border-radius: 999px;
        background-color: #f8fafc;
        color: #64748b;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .chip-todos:hover {
        border-color: #cbd5e1;
        background-color: #f1f5f9;
      }
      .chip-todos.active {
        border-color: #2563eb;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
      }
      .grid {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
      .grid-5 { grid-template-columns: repeat(5, 1fr); }
      .pill-btn {
        padding: 8px 2px;
        font-size: 12px;
        font-weight: 600;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        background-color: #f8fafc;
        color: #475569;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s ease;
      }
      .pill-btn:hover {
        border-color: #cbd5e1;
        background-color: #f1f5f9;
      }
      .pill-btn.active {
        border-color: #2563eb;
        background-color: #eff6ff;
        color: #1d4ed8;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.15);
      }
      .resumen-plan {
        font-size: 11px; color: #475569; background: #f8fafc;
        border: 1.5px solid #e2e8f0; border-radius: 8px;
        padding: 7px 10px; margin-bottom: 12px; line-height: 1.5;
      }
      .resumen-plan b { color: #0f172a; }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .btn {
        padding: 8px 16px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        border: none;
      }
      .btn-secondary {
        background-color: #e2e8f0;
        color: #475569;
      }
      .btn-primary {
        background-color: #2563eb;
        color: #ffffff;
        box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.25);
      }
      .btn-primary:hover {
        background-color: #1d4ed8;
      }
      /* --- Panel de confirmación con cuenta regresiva --- */
      .resultado { display: none; }
      .resultado.visible { display: block; }
      .res-titulo {
        font-size: 14px; font-weight: 700; margin-bottom: 8px;
        display: flex; align-items: center; gap: 7px;
      }
      .res-ok    { color: #15803d; }
      .res-error { color: #b91c1c; }
      .res-lineas {
        font-size: 12px; color: #475569; line-height: 1.7;
        background: #f8fafc; border: 1.5px solid #e2e8f0;
        border-radius: 8px; padding: 9px 12px; margin-bottom: 8px;
      }
      .res-lineas b { color: #0f172a; }
      .res-nota { font-size: 11px; color: #64748b; margin-bottom: 14px; line-height: 1.5; }
      .cierre { display: flex; align-items: center; gap: 11px; justify-content: flex-end; }
      .cierre-txt { font-size: 11px; color: #64748b; }
      .anillo-caja { position: relative; width: 42px; height: 42px; flex: 0 0 42px; }
      .anillo { width: 42px; height: 42px; transform: rotate(-90deg); }
      .anillo circle { fill: none; stroke-width: 4; }
      .anillo .pista { stroke: #e2e8f0; }
      .anillo .avance {
        stroke: #2563eb; stroke-linecap: round;
        transition: stroke-dashoffset 1s linear;
      }
      .anillo-num {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 700; color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="modal-title">🤖 Miguel - Agente Captador Fincaraiz</div>
    <div class="modal-subtitle">Modo: <b><?= tipoTexto ?></b> | Puedes elegir varios sectores y varias habitaciones a la vez.</div>

    <div class="seccion-head">
      <span class="seccion-label">Sector</span>
      <button class="chip-todos" id="chipSector" onclick="marcarTodos('sector')">Todos</button>
    </div>
    <div class="grid grid-3" id="gridSector">
      <button class="pill-btn" data-val="usaquen" onclick="alternarSector('usaquen')">Usaqu&eacute;n</button>
      <button class="pill-btn" data-val="suba" onclick="alternarSector('suba')">Suba</button>
      <button class="pill-btn" data-val="chapinero" onclick="alternarSector('chapinero')">Chapinero</button>
    </div>

    <div class="seccion-head">
      <span class="seccion-label">Habitaciones</span>
      <button class="chip-todos" id="chipHab" onclick="marcarTodos('hab')">Todas</button>
    </div>
    <div class="grid grid-5" id="gridHab">
      <button class="pill-btn" data-val="1" onclick="alternarHab('1')">1 Hab</button>
      <button class="pill-btn" data-val="2" onclick="alternarHab('2')">2 Habs</button>
      <button class="pill-btn" data-val="3" onclick="alternarHab('3')">3 Habs</button>
      <button class="pill-btn" data-val="4" onclick="alternarHab('4')">4 Habs</button>
      <button class="pill-btn" data-val="5" onclick="alternarHab('5')">5 Habs</button>
    </div>

    <div class="resumen-plan" id="resumenPlan"></div>

    <div class="actions" id="acciones">
      <button class="btn btn-secondary" onclick="google.script.host.close()">Cancelar</button>
      <button class="btn btn-primary" onclick="iniciar()">🚀 Iniciar Barrido</button>
    </div>

    <div class="resultado" id="resultado">
      <div class="res-titulo" id="resTitulo"></div>
      <div class="res-lineas" id="resLineas"></div>
      <div class="res-nota" id="resNota"></div>
      <div class="cierre" id="cierre">
        <span class="cierre-txt">Se cierra solo</span>
        <div class="anillo-caja">
          <svg class="anillo" viewBox="0 0 42 42">
            <circle class="pista"  cx="21" cy="21" r="18"></circle>
            <circle class="avance" cx="21" cy="21" r="18" id="anilloAvance"></circle>
          </svg>
          <div class="anillo-num" id="anilloNum">5</div>
        </div>
      </div>
    </div>

    <script>
      var CUOTA_POR_BARRIDO = 30;

      var SECTORES = ['usaquen', 'suba', 'chapinero'];
      var NOMBRE_SECTOR = { usaquen: 'Usaquén', suba: 'Suba', chapinero: 'Chapinero' };
      var HABS = ['1', '2', '3', '4', '5'];

      var selSector = ['usaquen', 'suba', 'chapinero'];
      var selHab = ['1'];

      /**
       * Marca o desmarca un valor. Nunca deja la lista vacía (sin sector o sin
       * habitación no hay barrido posible), así que el último seleccionado
       * ignora el clic en vez de dejar el modal en un estado inválido.
       * Devuelve la lista reordenada al orden canónico, para que el barrido
       * recorra siempre en el mismo orden sin importar en qué orden se hizo clic.
       */
      function alternar(seleccion, val, canonico) {
        var i = seleccion.indexOf(val);
        if (i >= 0) {
          if (seleccion.length === 1) return seleccion;
          seleccion.splice(i, 1);
        } else {
          seleccion.push(val);
        }
        return canonico.filter(function (c) { return seleccion.indexOf(c) >= 0; });
      }

      function alternarSector(val) {
        selSector = alternar(selSector, val, SECTORES);
        pintar();
      }

      function alternarHab(val) {
        selHab = alternar(selHab, val, HABS);
        pintar();
      }

      function marcarTodos(grupo) {
        if (grupo === 'sector') {
          selSector = SECTORES.slice();
        } else {
          selHab = HABS.slice();
        }
        pintar();
      }

      function marcarActivos(idGrid, seleccion) {
        var botones = document.querySelectorAll('#' + idGrid + ' .pill-btn');
        for (var i = 0; i < botones.length; i++) {
          var activo = seleccion.indexOf(botones[i].getAttribute('data-val')) >= 0;
          botones[i].classList.toggle('active', activo);
        }
      }

      /** Une nombres en lenguaje natural: "Usaquén y Chapinero". */
      function listar(nombres) {
        if (nombres.length === 1) return nombres[0];
        return nombres.slice(0, -1).join(', ') + ' y ' + nombres[nombres.length - 1];
      }

      /**
       * Ajusta el alto del diálogo al del contenido real. El resumen del plan
       * pasa de 1 a 3 líneas según lo que se marque, así que con un alto fijo
       * o sobraba espacio abajo o salía scroll. Se llama en cada repintado.
       * El try/catch es para poder abrir este HTML suelto en un navegador
       * (fuera del Sheet no existe google.script.host).
       */
      function ajustarAlto() {
        try {
          var alto = Math.ceil(document.body.getBoundingClientRect().height) + 2;
          google.script.host.setHeight(alto);
        } catch (e) { /* fuera del Sheet, se ignora */ }
      }

      function pintar() {
        marcarActivos('gridSector', selSector);
        marcarActivos('gridHab', selHab);
        document.getElementById('chipSector')
          .classList.toggle('active', selSector.length === SECTORES.length);
        document.getElementById('chipHab')
          .classList.toggle('active', selHab.length === HABS.length);

        var barridos = selSector.length * selHab.length;
        var techo = barridos * CUOTA_POR_BARRIDO;

        var nombres = selSector.map(function (s) { return NOMBRE_SECTOR[s]; });
        var textoSector = (selSector.length === SECTORES.length)
          ? 'las 3 localidades' : listar(nombres);
        var textoHab = (selHab.length === HABS.length)
          ? 'las 5 habitaciones' : listar(selHab) + ' habitación(es)';

        var texto = 'Se harán <b>' + barridos + '</b> barrido' + (barridos === 1 ? '' : 's') +
                    ' de ' + CUOTA_POR_BARRIDO + ': <b>' + textoSector + '</b> × <b>' +
                    textoHab + '</b>. Máximo <b>' + techo + '</b> captaciones.';

        if (barridos >= 10) {
          texto += '<br>Puede tardar <b>1 a 3 horas</b>; corre en la nube, puedes cerrar la hoja.';
        }
        document.getElementById('resumenPlan').innerHTML = texto;
        ajustarAlto();
      }

      /**
       * Se manda 'all' cuando está todo marcado (para no depender de que el
       * backend reconozca la lista completa) y la lista separada por coma en
       * cualquier otro caso: config.get_localidades / get_bedrooms entienden
       * ambas formas.
       */
      function valorDe(seleccion, canonico) {
        return seleccion.length === canonico.length ? 'all' : seleccion.join(',');
      }

      var SEGUNDOS_CIERRE = 5;
      var VUELTA = 2 * Math.PI * 18;   // circunferencia del anillo (r=18)

      /**
       * Muestra el panel de confirmación en lugar del formulario y arranca la
       * cuenta regresiva. Solo se cierra solo cuando SÍ arrancó el barrido: si
       * falló, el modal se queda abierto para poder leer el motivo.
       */
      function mostrarResultado(r) {
        document.getElementById('acciones').style.display = 'none';
        ['gridSector', 'gridHab', 'resumenPlan'].forEach(function (id) {
          document.getElementById(id).style.display = 'none';
        });
        var cabeceras = document.querySelectorAll('.seccion-head');
        for (var i = 0; i < cabeceras.length; i++) cabeceras[i].style.display = 'none';

        document.getElementById('resTitulo').innerHTML =
          (r.success ? '✅ ' : '❌ ') + r.titulo;
        document.getElementById('resTitulo').className =
          'res-titulo ' + (r.success ? 'res-ok' : 'res-error');

        var cajaLineas = document.getElementById('resLineas');
        if (r.lineas && r.lineas.length) {
          cajaLineas.innerHTML = r.lineas.join('<br>');
          cajaLineas.style.display = '';
        } else {
          cajaLineas.style.display = 'none';
        }
        document.getElementById('resNota').innerText = r.nota || '';
        document.getElementById('resultado').classList.add('visible');

        if (!r.success) {
          // Error: sin cuenta regresiva, se deja un botón para cerrar a mano.
          document.getElementById('cierre').innerHTML =
            '<button class="btn btn-secondary" onclick="google.script.host.close()">Cerrar</button>';
          ajustarAlto();
          return;
        }

        var anillo = document.getElementById('anilloAvance');
        anillo.setAttribute('stroke-dasharray', VUELTA);
        anillo.setAttribute('stroke-dashoffset', 0);
        ajustarAlto();

        var restan = SEGUNDOS_CIERRE;
        var tic = setInterval(function () {
          restan--;
          document.getElementById('anilloNum').innerText = restan > 0 ? restan : 0;
          // El anillo se va vaciando: a 0 segundos queda una vuelta completa.
          anillo.setAttribute('stroke-dashoffset',
                              VUELTA * (1 - restan / SEGUNDOS_CIERRE));
          if (restan <= 0) {
            clearInterval(tic);
            google.script.host.close();
          }
        }, 1000);
      }

      function iniciar() {
        var primaryBtn = document.querySelector('.btn-primary');
        primaryBtn.disabled = true;
        primaryBtn.innerText = '⏳ Activando...';

        google.script.run
          .withSuccessHandler(mostrarResultado)
          .withFailureHandler(function (err) {
            mostrarResultado({
              success: false,
              titulo: 'No se pudo contactar al servidor',
              lineas: [],
              nota: String(err && err.message ? err.message : err)
            });
          })
          .dispararWorkflowConHabitaciones(
            '<?= modo ?>',
            valorDe(selHab, HABS),
            valorDe(selSector, SECTORES)
          );
      }

      pintar();
    </script>
  </body>
</html>
